<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  --bg:#f7f8fa; --bg-2:#eef0f4; --panel:#ffffff; --panel-2:#fbfcfe;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
  --line:#e2e8f0; --line-2:#cbd5e1;
  --accent:#4f46e5; --accent-2:#6366f1; --accent-ink:#ffffff;
  --accent-soft:#eef2ff; --accent-soft-2:#e0e7ff;
  --user:#eef2ff; --ok:#059669; --warn:#b45309; --bad:#dc2626;
  --tool:#f1f5f9; --code:#0b1220; --code-ink:#e2e8f0;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 4px 16px -4px rgba(15,23,42,.10), 0 1px 2px rgba(15,23,42,.06);
  --shadow-lg:0 20px 40px -12px rgba(15,23,42,.25), 0 4px 12px rgba(15,23,42,.08);
  --radius-sm:6px; --radius:10px; --radius-lg:14px; --radius-xl:18px;
  --warn-bg:color-mix(in srgb,#b45309 12%,transparent);
  --bad-bg:color-mix(in srgb,#dc2626 10%,transparent);
  --ok-bg:color-mix(in srgb,#059669 10%,transparent);
  --sb-thumb:#cbd5e1; --sb-thumb-hover:#94a3b8; --sb-track:transparent;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b0f17; --bg-2:#111827; --panel:#131a26; --panel-2:#0f1621;
  --ink:#e6e9ef; --ink-2:#c7cdd6; --muted:#94a3b8; --muted-2:#64748b;
  --line:#1f2937; --line-2:#334155;
  --accent:#818cf8; --accent-2:#6366f1; --accent-ink:#0b0f17;
  --accent-soft:#1e1b4b; --accent-soft-2:#312e81;
  --user:#1e2340; --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --tool:#0f1621; --code:#050912; --code-ink:#dbe3ef;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 4px 16px -4px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 24px 48px -12px rgba(0,0,0,.7), 0 4px 12px rgba(0,0,0,.5);
  --warn-bg:color-mix(in srgb,#fbbf24 14%,transparent);
  --bad-bg:color-mix(in srgb,#f87171 14%,transparent);
  --ok-bg:color-mix(in srgb,#34d399 14%,transparent);
  --sb-thumb:#334155; --sb-thumb-hover:#475569;
}}

/* ============================================================
   Base + scrollbars
   ============================================================ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}

/* Thin, themed scrollbars everywhere (Chromium/Safari) */
*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) var(--sb-track)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--sb-track)}
::-webkit-scrollbar-thumb{
  background:var(--sb-thumb);border-radius:10px;
  border:2px solid transparent;background-clip:padding-box;
}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-hover);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}

/* ============================================================
   Form controls
   ============================================================ */
button,input,select,textarea{font:inherit;color:inherit}
button{
  cursor:pointer;border:1px solid var(--line);background:var(--panel);
  border-radius:var(--radius-sm);padding:6px 12px;font-weight:500;
  transition:border-color .15s,background .15s,opacity .15s,transform .05s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;
}
button:hover:not(:disabled){border-color:var(--line-2);background:var(--panel-2)}
button:active:not(:disabled){transform:translateY(.5px)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{
  background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
  font-weight:600;box-shadow:0 1px 0 rgba(0,0,0,.05) inset;
}
button.primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
button.danger{color:var(--bad)}
button.danger:hover:not(:disabled){background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover:not(:disabled){background:var(--bg-2)}

input,select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:7px 10px;min-width:0;transition:border-color .15s,box-shadow .15s;
}
input:hover,select:hover,textarea:hover{border-color:var(--line-2)}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent);
}
input[type="checkbox"]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}

/* ============================================================
   Layout
   ============================================================ */
#app{display:grid;grid-template-columns:260px minmax(0,1fr) 0;height:100%;transition:grid-template-columns .25s ease}
#app.leftcollapsed{grid-template-columns:0 minmax(0,1fr) 0}
#app.leftcollapsed.rightopen{grid-template-columns:0 minmax(0,1fr) 440px}
#app.rightopen{grid-template-columns:260px minmax(0,1fr) 440px}

/* ============================================================
   Left sidebar
   ============================================================ */
aside{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  position:relative;z-index:6;
}
#right{border-right:0;border-left:1px solid var(--line)}
#left-toggle{
  position:absolute;top:14px;right:10px;z-index:5;padding:4px;border:0;
  background:none;opacity:.4;cursor:pointer;transition:opacity .15s;
}
#left-toggle:hover{opacity:1}
#expand-left{position:fixed;top:14px;left:10px;z-index:5;display:none}
#app.leftcollapsed #expand-left{display:block}
#app.leftcollapsed header{padding-left:56px}
#expand-left:hover{background:var(--bg-2)}

.brand{
  display:flex;align-items:center;gap:10px;padding:16px 36px 10px 16px;
  font-weight:700;font-size:16px;letter-spacing:-.01em;
}
.brand i{
  width:24px;height:24px;border-radius:8px;background:var(--accent);
  display:inline-block;position:relative;
  box-shadow:0 2px 8px -2px color-mix(in srgb,var(--accent) 60%,transparent);
}
.brand i:after{content:"";position:absolute;inset:6px;border:2.5px solid var(--accent-ink);border-radius:50%}

.side-section{padding:0 12px 10px}
#newChat{
  width:100%;justify-content:flex-start;padding:9px 12px;font-weight:600;
}
#newChat::before{content:"+";font-size:16px;line-height:1;margin-right:2px}

#sessSearch{width:100%;font-size:12.5px;padding:6px 9px;background:var(--bg)}

#sessions{overflow:auto;padding:4px 6px 12px;flex:1}
.side-label{
  font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;
  font-weight:600;padding:10px 12px 4px;
}
.sess{
  display:flex;align-items:center;gap:6px;border-radius:var(--radius-sm);
  padding:7px 10px;cursor:pointer;color:var(--ink-2);
  transition:background .12s,color .12s;
  position:relative;
}
.sess:hover{background:var(--bg)}
.sess.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.sess.on::before{
  content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--accent);
}
.sess .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .t{font-size:11px;color:var(--muted-2);margin-left:auto;font-variant-numeric:tabular-nums}
.sess button{
  opacity:0;padding:2px 5px;border:0;background:none;color:var(--muted);
  border-radius:4px;transition:opacity .15s,background .15s;
}
.sess:hover button,.sess:focus-within button{opacity:1}
.sess button:hover{background:var(--bad-bg);color:var(--bad)}

/* ============================================================
   Main column
   ============================================================ */
main{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1}

header{
  display:flex;align-items:center;gap:8px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel);
  flex-wrap:wrap;position:relative;z-index:4;
}
header .sp{flex:1}

.chip{
  border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  font-size:12px;color:var(--muted);background:var(--bg);
  white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;transition:border-color .15s,color .15s,background .15s;
  display:inline-flex;align-items:center;gap:6px;
}
.chip::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
  opacity:.7;flex:none;
}
#routeChip::before{background:var(--ok)}
.chip:hover{border-color:var(--accent);color:var(--ink);background:var(--panel)}
.chip b{color:var(--ink);font-weight:600}

/* Toggle group for strict / auto-approve */
.toggle-group{
  display:inline-flex;align-items:center;border:1px solid var(--line);
  border-radius:999px;background:var(--bg);padding:2px;gap:0;
}
label.tog{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;
  color:var(--muted);cursor:pointer;padding:3px 10px;border-radius:999px;
  transition:background .15s,color .15s;user-select:none;
}
label.tog:hover{color:var(--ink-2)}
label.tog.on.strict{background:var(--warn-bg);color:var(--warn);font-weight:600}
label.tog.on:not(.strict){background:var(--bad-bg);color:var(--bad);font-weight:600}
label.tog input{display:none}

#autoBanner{
  display:none;padding:8px 16px;background:var(--bad-bg);color:var(--bad);
  border-bottom:1px solid color-mix(in srgb,var(--bad) 30%,transparent);
  font-size:12.5px;font-weight:600;text-align:center;letter-spacing:.01em;
}
#autoBanner.on{display:block}

/* ============================================================
   Chat log
   ============================================================ */
#log{flex:1;overflow:auto;padding:20px 0 12px;scroll-behavior:smooth}
.col{max-width:880px;margin:0 auto;padding:0 24px}

.msg{margin:12px 0;display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end;flex-direction:column;align-items:flex-end}
.msg.asst{flex-direction:column;align-items:flex-start}

.bubble{
  padding:10px 14px;border-radius:14px;max-width:88%;
  white-space:pre-wrap;word-wrap:break-word;line-height:1.6;
}
.user .bubble{
  background:var(--user);border-bottom-right-radius:4px;
  border:1px solid color-mix(in srgb,var(--accent) 15%,transparent);
}
.asst .bubble{
  background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;
  white-space:normal;max-width:100%;box-shadow:var(--shadow-sm);
}
.asst.mid .bubble{box-shadow:none;color:var(--muted);background:transparent;border-style:dashed}

.bubble p{margin:.5em 0} .bubble p:first-child{margin-top:0} .bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:.5em 0;padding-left:1.5em}
.bubble li{margin:.2em 0}
.bubble h1,.bubble h2,.bubble h3{margin:.7em 0 .3em;font-size:1.05em;letter-spacing:-.01em}
.bubble code{
  background:var(--tool);padding:1px 6px;border-radius:5px;
  font:12.5px ui-monospace,Menlo,Consolas,monospace;
}
.bubble pre{
  background:var(--code);color:var(--code-ink);padding:12px 14px;
  border-radius:var(--radius);overflow:auto;margin:.6em 0;
  font-size:12.5px;line-height:1.55;
}
.bubble pre code{background:none;padding:0;color:inherit;font-size:inherit}

/* ============================================================
   Tool cards
   ============================================================ */
.tool{
  margin:6px 0;background:var(--tool);border-radius:var(--radius);
  border:1px solid var(--line);border-left:3px solid var(--muted-2);
  font-size:12.5px;transition:border-left-color .15s;
}
.tool[data-status="ok"]{border-left-color:var(--ok)}
.tool[data-status="bad"]{border-left-color:var(--bad)}
.tool[data-status="run"]{border-left-color:var(--warn)}
.tool summary{
  padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;
  list-style:none;border-radius:var(--radius);
}
.tool summary:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.tool summary::-webkit-details-marker{display:none}
.tool summary .n{font-weight:600;color:var(--ink)}
.tool summary .a{
  color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
}
.tool summary .d{
  font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums;
  padding:1px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line);
}
.tool .st{
  width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:none;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--muted-2) 20%,transparent);
}
.tool .st.ok{background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 20%,transparent)}
.tool .st.bad{background:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 20%,transparent)}
.tool pre{
  margin:0;padding:10px 14px;border-top:1px solid var(--line);
  overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-word;
  font:12px ui-monospace,Menlo,Consolas,monospace;line-height:1.5;
}

/* ============================================================
   Notes / banners
   ============================================================ */
.note{margin:8px 0;font-size:12.5px;color:var(--warn);padding-left:6px}
.note.err{
  color:var(--bad);background:var(--bad-bg);
  border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);
  padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap;
}
.note.verify{
  color:var(--warn);background:var(--warn-bg);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap;margin:8px 0;
}

/* ============================================================
   Empty state
   ============================================================ */
.empty{max-width:680px;margin:10vh auto 0;text-align:center;color:var(--muted)}
.empty h2{
  color:var(--ink);margin:0 0 8px;font-size:22px;font-weight:700;letter-spacing:-.02em;
}
.empty h2::before{content:"✨  ";font-weight:400}
.empty .ex{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:12px;margin-top:24px;text-align:left;
}
.empty .ex button{
  padding:14px 16px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius-lg);color:var(--ink);
  transition:border-color .15s,transform .15s,box-shadow .15s;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  white-space:normal;
}
.empty .ex button:hover{
  border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow);
  background:var(--panel);
}
.empty .ex .t{font-weight:600;font-size:13.5px;color:var(--ink)}
.empty .ex .s{font-size:12px;color:var(--muted);line-height:1.5}

/* ============================================================
   Composer
   ============================================================ */
#composer{
  padding:12px 0 20px;background:var(--bg);
  border-top:1px solid var(--line);position:relative;
}
#composer .col{position:relative}
.box{
  display:flex;gap:10px;align-items:flex-end;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px;
  box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s;
}
.box:focus-within{
  border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent), var(--shadow-sm);
}
.box textarea{
  flex:1;border:0;resize:none;max-height:220px;padding:8px 4px;background:transparent;
  line-height:1.55;
}
.box textarea:focus{outline:none;box-shadow:none;border-color:transparent}
#attach{
  padding:8px 10px;border-radius:var(--radius-sm);font-size:16px;
  transition:background .15s;background:transparent;border:0;
}
#attach:hover{background:var(--bg-2)}
#send,#stop{padding:8px 16px;border-radius:var(--radius-sm)}

/* Status card */
.status{margin:0 0 8px}
.status-card{
  border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);
  padding:12px 14px;box-shadow:var(--shadow-sm);
}
.status-card .title{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:4px}
.status-card .title .spin{
  width:10px;height:10px;border-radius:50%;background:var(--accent);
  animation:pulse 1.2s infinite;flex:none;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.status-card .detail{color:var(--muted);font-size:12.5px}
.status-card ul{
  margin:8px 0 0;padding-left:1.2em;color:var(--muted);font-size:12px;
  max-height:120px;overflow:auto;
}
.status-card .foot{display:flex;justify-content:flex-end;margin-top:8px}

/* ============================================================
   Message actions
   ============================================================ */
.msg-actions{display:flex;gap:6px;margin-top:6px;opacity:0;transition:opacity .2s}
.msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1}
@media (hover:none){.msg-actions{opacity:1}}
.msg-actions button{
  padding:3px 9px;font-size:11px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);border-radius:var(--radius-sm);
  transition:all .2s;font-weight:500;
}
.msg-actions button:hover{
  background:var(--accent);color:var(--accent-ink);border-color:var(--accent);
}
.copy-code{
  position:absolute;top:10px;right:10px;padding:3px 8px;font-size:11px;
  opacity:0;transition:opacity .2s;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);border-radius:var(--radius-sm);
  color:var(--code-ink);font-weight:500;
}
div:hover>.copy-code{opacity:1}
.copy-code:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ============================================================
   Right panel (Keys / MCP / Files)
   ============================================================ */
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel-2)}
.tabs button{
  flex:1;border:0;border-radius:0;background:none;padding:12px 8px;
  color:var(--muted);border-bottom:2px solid transparent;
  font-weight:500;transition:color .15s,border-color .15s,background .15s;
}
.tabs button:hover{color:var(--ink-2);background:var(--bg-2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

.pane{overflow:auto;padding:14px;flex:1;display:none;background:var(--bg)}
.pane.on{display:block}

/* Card */
.card{
  border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:14px 16px;margin-bottom:14px;background:var(--panel);
  box-shadow:var(--shadow-sm);
}
.card h3{
  margin:0 0 10px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink);
}

/* Rows */
.row{display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:0}
.row>label.tog{display:inline-flex}

.small{font-size:12px;color:var(--muted);line-height:1.5}

/* Badges */
.badge{
  font-size:11px;border-radius:999px;padding:2px 9px;
  border:1px solid var(--line);color:var(--muted);font-weight:500;
  background:var(--bg);line-height:1.4;
}
.badge.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-bg)}
.badge.w{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-bg)}
.badge.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-bg)}

/* Key list */
.keys{
  margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;
  max-height:320px;overflow:auto;
}
.k{
  display:flex;gap:8px;align-items:center;padding:6px 4px;font-size:12.5px;
  border-radius:var(--radius-sm);transition:background .12s;
}
.k:hover{background:var(--bg)}
.k .dot{
  width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 20%,transparent);
}
.k .dot.rate,.k .dot.server,.k .dot.network{background:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 20%,transparent)}
.k .dot.quota{background:#ea580c;box-shadow:0 0 0 2px rgba(234,88,12,.2)}
.k .dot.auth,.k .dot.billing{background:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 20%,transparent)}
.k .nm{
  width:100px;font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12px;
}
.k .mk{
  width:100px;color:var(--muted);
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
  padding:1px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--line);
}
.k .info{
  flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:12px;
}
.k button{padding:2px 8px;font-size:11.5px;min-height:24px}
.k input{padding:3px 8px;font-size:12px;max-width:200px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* Keys textarea */
textarea.keysbox{
  width:100%;height:76px;font:12px ui-monospace,Menlo,Consolas,monospace;
  line-height:1.5;resize:vertical;
}

/* Files */
.files .f{
  display:flex;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);

}

.files .f span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files a{color:var(--accent);text-decoration:none;font-weight:500}
.files a:hover{text-decoration:underline}

/* MCP rows */
.mcp-row{
  display:flex;gap:10px;align-items:center;padding:8px 4px;
  border-bottom:1px dashed var(--line);
}
.mcp-row:last-child{border-bottom:0}
.mcp-row .nm{font-weight:600;flex:1;font-size:13px}
.mcp-row > span[style]{flex:none !important}

/* ============================================================
   Modals
   ============================================================ */
#modal,#confirm{
  position:fixed;inset:0;background:rgba(2,6,23,.55);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
}
#modal.on,#confirm.on{display:flex}
#modal .dlg,#confirm .dlg{
  background:var(--panel);border-radius:var(--radius-xl);width:100%;
  padding:22px;box-shadow:var(--shadow-lg);border:1px solid var(--line);
  animation:pop .15s ease;display:flex;flex-direction:column;
}
#modal .dlg{max-width:640px}
#confirm .dlg{max-width:460px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(4px)}to{opacity:1;transform:none}}
#modal h3,#confirm h3{
  margin:0 0 12px !important;font-size:16px;letter-spacing:-.01em;color:var(--ink);
}
#modal pre{
  background:var(--code);color:var(--code-ink);padding:14px;border-radius:var(--radius);
  overflow:auto;max-height:44vh;white-space:pre-wrap;word-break:break-word;
  font:12.5px ui-monospace,Menlo,Consolas,monospace;line-height:1.55;
}
#confirm .msg{color:var(--ink-2);margin:0 0 20px;white-space:pre-wrap;line-height:1.6;font-size:13.5px}
#confirm .actions{display:flex;justify-content:flex-end;gap:8px}

/* ============================================================
   Toasts
   ============================================================ */
#toasts{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;gap:8px;z-index:60;max-width:90vw;align-items:center;
}
.toast{
  background:var(--ink);color:var(--bg);padding:10px 16px;
  border-radius:var(--radius);opacity:0;transition:opacity .2s,transform .2s;
  max-width:90vw;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);
  transform:translateY(4px);
}
.toast.on{opacity:1;transform:none}

/* Scroll-to-bottom pill */
#scrollDown{
  position:fixed;right:24px;bottom:130px;z-index:15;
  border-radius:999px;padding:8px 16px;background:var(--panel);
  border:1px solid var(--line);box-shadow:var(--shadow);
  display:none;font-size:12px;font-weight:500;
}
#scrollDown.on{display:inline-flex}
#scrollDown:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* ============================================================
   Workspace browser modal
   ============================================================ */
#browse .dlg{
  background:var(--panel);border-radius:var(--radius-xl);
  border:1px solid var(--line);padding:22px;width:100%;max-width:840px;
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
}
.crumbs{
  display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 0;
  font-size:12.5px;min-width:0;
}
.crumbs .crumb{padding:2px 8px;border-radius:var(--radius-sm);font-size:12.5px}
.crumbs .crumb.cur{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.recent{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0;align-items:center}
.recent button{padding:3px 10px;font-size:12px}

#browse .listing{
  max-height:48vh;overflow:auto;margin-top:10px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel-2);
}
#browse .listing .f{
  display:flex;gap:10px;padding:8px 12px;cursor:pointer;
  border-bottom:1px solid var(--line);font-size:13px;align-items:center;
  transition:background .1s;
}
#browse .listing .f:last-child{border-bottom:0}
#browse .listing .f:hover{background:var(--bg)}
#browse .listing .f.sel{background:var(--accent-soft);color:var(--ink)}
#browse .listing .f:focus{outline:2px solid var(--accent);outline-offset:-2px}
#browse .listing .f .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:900px){
  #app,#app.rightopen{grid-template-columns:0 minmax(0,1fr) 0}
  #left{
    position:fixed;inset:0 auto 0 0;width:280px;z-index:10;
    transform:translateX(-100%);transition:transform .2s;
  }
  #app.leftopen #left{transform:none;box-shadow:var(--shadow-lg)}
  #right{position:fixed;inset:0;z-index:12;display:none;width:100%}
  #app.rightopen #right{display:flex}
  .col{padding:0 16px}
  header{padding:10px 14px 10px 52px}
}
@media (min-width:901px){.only-small{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}

<body>
<div id="app">
  <aside id="left">
    <button id="left-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">◀</button>

  <main>

      <span class="sp"></span>

      </div>
    </div></div>
  </main>

  <aside id="right">
    <div class="tabs">

      <button data-tab="mcp">MCP</button>

    </div>

    <div class="pane" id="pane-files"></div>
  </aside>
</div>

<div id="modal"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <h3 id="modalTitle">Omni wants to do this</h3>
  <pre id="modalAction"></pre>
  <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)">
    <input type="checkbox" id="modalRemember"> Don't ask again for this tool this session
  </label>
  <div class="row" style="justify-content:flex-end;margin-top:14px">
    <button id="deny" class="danger">Deny</button>
    <button id="allow" class="primary">Allow</button>
  </div>
</div></div>

  <h3 id="confirmTitle">Confirm</h3>

    <button id="confirmNo">Cancel</button>
    <button id="confirmYes" class="primary">OK</button>
  </div>
</div></div>

<div id="toasts"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k in el && k !== "list" && k !== "form") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false)
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function toast(t, ms = 2800) {
  const e = h("div", { class: "toast", text: t });
  $("#toasts").append(e);
  requestAnimationFrame(() => e.classList.add("on"));
  setTimeout(() => { e.classList.remove("on"); setTimeout(() => e.remove(), 300); }, ms);
}
async function api(path, body, opt = {}) {
  const init = body === undefined && !opt.post
    ? { headers: { "X-Omni": "1" } }
    : { method: "POST", headers: { "X-Omni": "1", "Content-Type": "application/json" },
        body: JSON.stringify(body || {}) };
  const r = await fetch(path, init);
  if (r.status === 401) {
    toast("Session expired — reopen the link printed in the terminal", 6000);
    throw new Error("not authorised");
  }
  let d = {}; try { d = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
};
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)),
  b => b.toString(16).padStart(2, "0")).join("");

function inline(text) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    const t = m[0];
    if (t[0] === "`") frag.append(h("code", { text: t.slice(1, -1) }));
    else if (t.startsWith("**")) frag.append(h("b", { text: t.slice(2, -2) }));
    else {
      const mm = /\[([^\]]+)\]\(([^)]+)\)/.exec(t);
      frag.append(h("a", { href: mm[2], target: "_blank", rel: "noopener noreferrer", text: mm[1] }));
    }
    last = m.index + t.length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}
function md(src) {
  const root = document.createElement("div");
  const parts = String(src).split(/```/);
  parts.forEach((part, i) => {
    if (i % 2) {
      const body = part.replace(/^[^\n]*\n/, "");
      const code = h("code", { text: body.replace(/\n$/, "") });
      const pre = h("pre", {}, code);
      const copyBtn = h("button", { class: "copy-code", text: "Copy",
        onclick: () => copyText(code.textContent) });
      root.append(h("div", { style: "position:relative" }, pre, copyBtn));
      return;
    }
    let list = null;
    for (const para of part.split(/\n{2,}/)) {
      const lines = para.split("\n");
      for (const ln of lines) {
        let m;
        if ((m = /^\s*([-*]|\d+\.)\s+(.*)/.exec(ln))) {
          const tag = /\d/.test(m[1]) ? "ol" : "ul";
          if (!list || list.tagName.toLowerCase() !== tag) { list = h(tag); root.append(list); }
          list.append(h("li", {}, inline(m[2])));
        } else if ((m = /^(#{1,3})\s+(.*)/.exec(ln))) {
          list = null; root.append(h("h" + m[1].length, {}, inline(m[2])));
        } else if (ln.trim()) {
          list = null;
          const last = root.lastChild;
          if (last && last.tagName === "P" && last.dataset.open) {
            last.append(document.createElement("br"), inline(ln));
          } else {
            const p = h("p", {}, inline(ln)); p.dataset.open = "1"; root.append(p);
          }
        }
      }
      list = null;
      if (root.lastChild && root.lastChild.dataset) delete root.lastChild.dataset.open;
    }
  });
  return root;
}

let sid = store.get("omni_sid") || rid(), cursor = 0, busy = false, polling = false;
let lastRoute = null;
store.set("omni_sid", sid);
const msgs = $("#msgs"), logEl = $("#log"), toolEls = {};
function atBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 140; }
function scrollToBottom() { logEl.scrollTop = logEl.scrollHeight; $("#scrollDown").classList.remove("on"); }
function maybeShowScrollDown() {
  if (busy && !atBottom()) $("#scrollDown").classList.add("on");
  else $("#scrollDown").classList.remove("on");
}
logEl.addEventListener("scroll", maybeShowScrollDown);
$("#scrollDown").onclick = scrollToBottom;

function add(el) {
  const stick = atBottom(); clearEmpty(); msgs.append(el);
  if (stick) scrollToBottom();
  return el;
}
function clearEmpty() { const e = $("#emptyState"); if (e) e.remove(); }
function showEmpty() {
  const examples = [
    ["Summarise my Documents folder", "Lists files and reads the ones that matter (asks for approval).", "Summarise the files in my Documents folder (will ask for approval)"],
    ["Review the code here", "Reads the sources, runs the tests, writes REVIEW.md.", "Review the code here and write REVIEW.md"],
    ["Create a Word report from my notes", "Builds a .docx with headings, keeping your content.", "Create a Word report from my notes"],
    ["Clean up a spreadsheet", "Edits .xlsx cells in place without touching the layout.", "In report.xlsx set B2 to the sum of B3:B9"],
  ];
  msgs.append(h("div", { class: "empty", id: "emptyState" },
    h("h2", { text: "What should Omni work on?" }),
    h("div", { text: "Reads and edits code and Office files, runs commands, browses pages, and (if configured) talks to MCP servers. Full PC access with approval." }),
    h("div", { class: "ex" }, ...examples.map(([t, s, prompt]) =>
      h("button", { type: "button", onclick: () => { $("#inp").value = prompt; $("#inp").focus(); autoGrow(); } },
        h("div", { class: "t", text: t }),
        h("div", { class: "s", text: s }))))));
}

/* Human-readable labels for the internal cooldown kinds shown in the
   progress card so non-technical users understand what's happening. */
const KIND_LABEL = {
  rate: "rate-limited",
  auth: "invalid key",
  quota: "out of quota",
  model: "model unavailable",
  billing: "no credits",
  server: "service error",
  network: "network error",
  empty: "empty reply",
  param: "bad parameters",
  tools: "no tool support",
  fatal: "error",
};
function humanizeRecent(list) {
  if (!list) return list;
  return list.map(line => {
    // server sends "name [model] -> kind"
    const m = /^(\S+) \[([^\]]+)\] -> (\S+)/.exec(line);
    if (!m) return line;
    const kind = KIND_LABEL[m[3]] || m[3];
    return `${m[1]} (${m[2]}) ${kind}`;
  });
}

let statusState = {};
function renderStatus() {
  const w = $("#working");
  if (!busy) { w.replaceChildren(); return; }
  const info = statusState;
  const card = h("div", { class: "status-card" });
  card.append(h("div", { class: "title" },
    h("span", { class: "spin" }),
    h("span", { text: info.title || "Working…" }),
    info.route ? h("span", { class: "small", text: " · " + info.route }) : null));
  if (info.detail) card.append(h("div", { class: "detail", text: info.detail }));
  const recent = humanizeRecent(info.recent);
  if (recent && recent.length) {
    const ul = h("ul");
    for (const r of recent.slice(-6)) ul.append(h("li", { text: r }));
    card.append(ul);
  }
  card.append(h("div", { class: "foot" },
    h("button", { class: "danger", text: "Stop", onclick: doStop })));
  w.replaceChildren(card);
}
function updateStatus(patch) { statusState = Object.assign({}, statusState, patch); renderStatus(); }
function setBusy(b, reset = true) {
  busy = b;
  $("#send").style.display = b ? "none" : "";
  $("#stop").style.display = b ? "" : "none";
  if (reset) statusState = {};
  renderStatus();
  maybeShowScrollDown();
}

/* Build the actions row for any message. Always shows Copy; Retry on
   assistant/final; Edit and Delete on user/final when we know the index. */
function actionsFor(kind, ev) {
  const kids = [];
  if (kind === "user") {
    if (typeof ev.idx === "number")
      kids.push(h("button", { text: "Edit", onclick: (e) => editMsg(e, ev) }));
    kids.push(h("button", { text: "Copy", onclick: () => copyText(ev.text) }));
    if (typeof ev.idx === "number")
      kids.push(h("button", { text: "Delete", onclick: (e) => deleteMsg(e, ev) }));
  } else if (kind === "assistant") {
    kids.push(h("button", { text: "Retry", onclick: (e) => retryMsg(e, ev) }));
    kids.push(h("button", { text: "Copy", onclick: () => copyText(ev.text) }));
  } else if (kind === "final") {
    kids.push(h("button", { text: "Retry", onclick: (e) => retryMsg(e, ev) }));
    kids.push(h("button", { text: "Copy", onclick: () => copyText(ev.text) }));
    if (typeof ev.idx === "number")
      kids.push(h("button", { text: "Delete", onclick: (e) => deleteMsg(e, ev) }));
  }
  return h("div", { class: "msg-actions" }, ...kids);
}

function render(ev) {
  switch (ev.type) {
    case "user": return add(h("div", { class: "msg user" },
      h("div", { class: "bubble", text: ev.text }),
      actionsFor("user", ev)));

    case "assistant": return add(h("div", { class: "msg asst mid" },
      h("div", { class: "bubble" }, md(ev.text)),
      actionsFor("assistant", ev)));

    case "final": return add(h("div", { class: "msg asst" },
      h("div", { class: "bubble" }, md(ev.text)),
      actionsFor("final", ev)));

    case "tool": {
      let args = ev.text || "", pretty = args;
      try {
        const o = JSON.parse(args);
        pretty = JSON.stringify(o, null, 1);
        args = Object.entries(o).map(([k, v]) =>
          k + "=" + (typeof v === "string" ? v : JSON.stringify(v)).replace(/\s+/g, " ")).join("  ");
      } catch (_) {}
      const t0 = performance.now();
      const d = h("details", { class: "tool", "data-status": "run" },
        h("summary", {}, h("span", { class: "st" }), h("span", { class: "n", text: ev.name }),
          h("span", { class: "a", text: args.slice(0, 160) }),
          h("span", { class: "d", "data-t0": String(t0) })),
        h("pre", { text: pretty }));
      if (ev.id) toolEls[ev.id] = d;
      return add(d);
    }
    case "tool_result": {
      const d = toolEls[ev.id]; if (!d) return;
      d.querySelector(".st").classList.add(ev.ok ? "ok" : "bad");
      d.dataset.status = ev.ok ? "ok" : "bad";
      const dt = d.querySelector(".d");
      if (dt && dt.dataset.t0) {
        const s = ((performance.now() - Number(dt.dataset.t0)) / 1000).toFixed(1);
        dt.textContent = s + "s";
      }
      if (!d.querySelector("pre.stream")) d.append(h("pre", { text: ev.text }));
      else if (!ev.ok) d.append(h("pre", { text: "ERROR (see stream above):\n" + ev.text }));
      return;
    }
    case "tool_stream": {
      const d = toolEls[ev.id]; if (!d) return;
      let pre = d.querySelector("pre.stream");
      if (!pre) { pre = h("pre", { class: "stream" }); d.append(pre); }
      pre.textContent += ev.text;
      if (atBottom()) scrollToBottom();
      else maybeShowScrollDown();
      return;
    }
    case "notice": return add(h("div", { class: "note", text: "↪ " + ev.text }));
    case "progress":
      updateStatus({ title: ev.title || "Working", detail: ev.detail, recent: ev.recent, route: ev.route });
      return;
    case "verify": return add(h("div", { class: "note verify", text: ev.text }));
    case "route": {
      lastRoute = ev;
      const c = $("#routeChip");
      c.replaceChildren("answering: ", h("b", { text: ev.text }));
      c.title = `pool=${ev.pool} · key=${ev.provider} · model=${ev.model} · reason=${ev.reason || "primary"}`;
      updateStatus({ route: ev.text });
      return;
    }
    case "error":
      return add(h("div", { class: "note err" },
        h("div", { text: ev.text }),
        h("div", { style: "margin-top:6px" },
          h("button", { text: "Retry", onclick: (e) => retryMsg(e, {}) }))));
    case "approval": return askApproval(ev);
    case "approval_done": if (pendingApproval && pendingApproval.id === ev.id) closeModal(); return;
  }
}

async function poll() {
  if (polling) return; polling = true; let fails = 0;
  try {
    while (true) {
      let d;
      try { d = await api(`/api/poll?session=${sid}&after=${cursor}&wait=15`); fails = 0; }
      catch (e) {
        if (/not authorised|authoris/.test(e.message)) { toast("Session expired — reopen the link from the terminal"); setBusy(false); break; }
        if (++fails >= 5) { toast("Lost connection to the Omni server: " + e.message, 6000); setBusy(false); break; }
        await new Promise(r => setTimeout(r, Math.min(1000 * 2 ** fails, 8000)));
        continue;
      }
      cursor = d.next;
      let done = false;
      for (const ev of d.events) {
        if (ev.type === "user") continue;
        if (ev.type === "done") done = true; else render(ev);
      }
      if (done || (!d.busy && !d.events.length)) {
        setBusy(false); refreshKeys(); loadSessions();
        break;
      }
    }
  } finally {
    polling = false;
  }
}

async function send() {
  const inp = $("#inp");

    render({ type: "user", text: t, idx: (typeof r.user_idx === "number" ? r.user_idx : undefined) });
    cursor = r.cursor;
    statusState = { title: "Sending…" };
    setBusy(true, false);
    poll();
  } catch (e) {
    inp.value = restore; autoGrow();      // put their text back on failure
    toast(e.message, 5000);
  }
}

function entrable(input, action) {

let S = null, modelCache = {};

/* Key panel: re-render on every action, but snapshot user-typed values first
   so a paste-in-progress survives the rebuild. */
async function act(fn, okMsg) {
  try {
    const r = await fn();
    if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg);
    await refreshKeys(true);
    return r;
  } catch (e) { toast(e.message, 6000); }

function snapshotInputs() {
  const snap = {};
  const pane = $("#pane-keys");
  if (!pane) return snap;
  pane.querySelectorAll("[data-persist]").forEach(el => {
    snap[el.dataset.persist] = el.value;
  });
  return snap;
}
function restoreInputs(snap) {
  const pane = $("#pane-keys");
  if (!pane) return;
  pane.querySelectorAll("[data-persist]").forEach(el => {
    if (snap[el.dataset.persist] !== undefined) el.value = snap[el.dataset.persist];

async function refreshKeys(force, keepFocus = true) {
  const pane = $("#pane-keys");
  if (!force && keepFocus && pane.contains(document.activeElement) &&
      /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  try { S = await api("/api/state"); } catch (e) { return; }
  // Seed the client-side modelCache from the state response when it's
  // missing. /api/state includes each key's cached `models` array, so a
  // pool whose models were refreshed server-side (Refresh all, per-key ↻,
  // or a page reload) still gets a populated <datalist> on the next render.
  for (const p of S.pools || []) {
    if (!modelCache[p.pool] && p.keys && p.keys.length &&
        Array.isArray(p.keys[0].models) && p.keys[0].models.length) {
      modelCache[p.pool] = p.keys[0].models;
    }
  }
  $("#wsChip").replaceChildren("workspace: ", h("b", { text: S.workspace }));
  renderKeys();
  renderMcp();
}
function renderKeys() {
  const pane = $("#pane-keys");

  const savedScroll = pane.scrollTop;
  const savedInputs = snapshotInputs();
  pane.replaceChildren();
  if (S.load_error) pane.append(h("div", { class: "note err", text: S.load_error }));

  pane.append(h("div", { class: "card" },

      h("select", {

      },

          text: s === "round_robin" ? "round robin — spread calls over all keys"
                                     : "failover — use keys in order" })))),
    h("div", { class: "small", text: "Keys are scored by health, so a flaky key is deprioritized automatically. Rate limits cool the key; model-not-found cools the whole pool; daily quotas cool until midnight Pacific. Short limits are waited out (up to " + S.max_wait + "s)." })));

  pane.append(h("div", { class: "card" },
    h("h3", { text: "Models" }),
    h("div", { class: "row" },
      h("button", { class: "primary", text: "↻ Refresh all model lists",
        onclick: async e => {
          const t = e.target; t.textContent = "fetching…"; t.disabled = true;
          try {
            const r = await api("/api/refresh_all", {});
            // Fill the browser-side cache from the per-pool lists the
            // server just returned, THEN re-render. Without this the
            // pool cards rebuild their <datalist> from an empty
            // modelCache and the dropdowns look unchanged.
            let total = 0;
            for (const [pool, models] of Object.entries(r.models || {})) {
              modelCache[pool] = models || [];
              total += modelCache[pool].length;
            }
            const nKeys = Object.keys(r.refreshed || {}).length;
            const nPools = Object.keys(r.models || {}).length;
            toast(`Refreshed ${nKeys} key(s) across ${nPools} pool(s) — ${total} models`);
            await refreshKeys(true);
          } catch (err) {

            t.textContent = "↻ Refresh all model lists"; t.disabled = false;

      h("span", { class: "small", text: "Each key's available models are fetched from its provider and shown in the dropdown next to it." }))));

  // "Add a service" goes on top when there are no pools yet (so a new

  if (!S.pools.length) pane.append(addServiceCard(savedInputs));
  S.pools.forEach((p, i) => pane.append(poolCard(p, i, openKeys.has(p.pool), savedInputs)));
  if (S.pools.length) pane.append(addServiceCard(savedInputs));
  // Defer scroll restore so the browser has laid out the new content first.
  requestAnimationFrame(() => {
    pane.scrollTop = savedScroll;
    restoreInputs(savedInputs);
  });
}

  const refreshBtn = h("button", { text: "↻ Refresh catalog", title: "Re-fetch the official registry (cached for 1 hour)",
    onclick: () => loadRegistry(true) });

  const name = h("input", { placeholder: "server name (e.g. filesystem)", spellcheck: false });
  const cmd = h("input", { placeholder: "command (e.g. npx)", spellcheck: false });
  const args = h("input", { placeholder: "args, space-separated (e.g. -y @modelcontextprotocol/server-filesystem /home/you)", spellcheck: false });
  const urlIn = h("input", { placeholder: "remote URL (e.g. https://mcp.example.com/mcp) — leave blank for local", spellcheck: false });
  const envIn = h("textarea", { class: "keysbox", spellcheck: false,
    placeholder: "env / secrets — one KEY=VALUE per line, e.g.\nGITHUB_PERSONAL_ACCESS_TOKEN=ghp_...\nGOOGLE_OAUTH_TOKEN=ya29....",
  });
  const headersIn = h("textarea", { class: "keysbox", spellcheck: false,
    placeholder: "HTTP headers (remote servers only) — one Header: value per line, e.g.\nAuthorization: Bearer eyJ...",
  });

  function parseEnv(text) {
    const out = {};
    for (const raw of (text || "").split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith("#")) continue;
      const i = line.indexOf("=");
      if (i <= 0) continue;
      const k = line.slice(0, i).trim();
      let v = line.slice(i + 1).trim();
      if (v.startsWith('"') && v.endsWith('"')) v = v.slice(1, -1);
      if (v.startsWith("'") && v.endsWith("'")) v = v.slice(1, -1);
      if (k) out[k] = v;
    }
    return out;
  }
  function parseHeaders(text) {
    const out = {};
    for (const raw of (text || "").split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith("#")) continue;
      const i = line.indexOf(":");
      if (i <= 0) continue;
      out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    }
    return out;
  }

  const addBtn = h("button", { class: "primary", text: "Add & connect",
    onclick: () => act(() => api("/api/mcp/add", {
        name: name.value,
        command: cmd.value,
        args: args.value.split(/\s+/).filter(Boolean),
        url: urlIn.value.trim(),
        env: parseEnv(envIn.value),
        headers: parseHeaders(headersIn.value),
      }),
      r => `Connected: ${r.tools} tools`) });
  [name, cmd, args, urlIn].forEach(el => entrable(el, () => addBtn.click()));

  function applyTemplate(row) {
    const t = row.template;
    if (!t || t.unsupported) { hint.textContent = (t && t.reason) || "No template available — fill in command and args manually."; return; }
    const short = (row.name || "").split("/").pop().replace(/[^A-Za-z0-9_\-]/g, "_").slice(0, 32) || "mcp";
    name.value = short;
    if (t.transport === "http") {
      cmd.value = "";
      args.value = "";
      urlIn.value = t.url || "";
      hint.textContent = "Pre-filled remote endpoint from " + row.name + (t.note ? " (" + t.note + ")" : "") + ". Review and click Add.";
      urlIn.focus();
    } else {
      urlIn.value = "";
      cmd.value = t.command || "";
      args.value = (t.args || []).join(" ");
      hint.textContent = "Pre-filled from " + row.name + ". Check the args before adding.";
      cmd.focus();
    }
  }

  let registryCache = null;
  async function loadRegistry(force) {
    results.replaceChildren(h("div", { class: "small", text: "Loading registry…" }));
    try {
      const d = await api(`/api/mcp_registry?limit=300${force ? "&refresh=1" : ""}`);
      registryCache = d.servers || [];
      if (d.error) hint.textContent = "Registry unavailable: " + d.error + " — you can still add a server by hand below.";
      renderResults();
    } catch (e) {
      results.replaceChildren(h("div", { class: "note err", text: e.message }));
    }
  }
  function renderResults() {
    const q = (searchIn.value || "").toLowerCase();
    const list = (registryCache || []).filter(r =>
      !q || r.name.toLowerCase().includes(q) || (r.description || "").toLowerCase().includes(q));
    if (!list.length) { results.replaceChildren(h("div", { class: "small", text: "No matching servers." })); return; }
    results.replaceChildren(...list.slice(0, 100).map(r => {
      const disabled = r.template && r.template.unsupported;
      return h("div", { class: "mcp-result", style: "padding:8px 6px;border-bottom:1px solid var(--line);cursor:" + (disabled ? "not-allowed" : "pointer") + ";opacity:" + (disabled ? ".55" : "1"),
        onclick: disabled ? null : () => applyTemplate(r) },
        h("div", { style: "display:flex;gap:8px;align-items:center" },
          h("b", { text: r.name }),
          r.installed ? badge("installed", "g") : null,
          disabled ? badge("remote", "w") : null),
        r.description ? h("div", { class: "small", text: r.description }) : null,
        disabled ? h("div", { class: "small", text: r.template.reason || "" }) : null);
    }));
  }
  searchIn.addEventListener("input", renderResults);
  entrable(searchIn, () => results.querySelector(".mcp-result")?.click());

  pane.append(h("div", { class: "card" },
    h("h3", { text: "Browse the MCP registry" }),
    h("div", { class: "row" }, searchIn, refreshBtn),
    results,
    h("div", { class: "row" }, hint)));

  pane.append(h("div", { class: "card" },
    h("h3", { text: "Add an MCP server" }),
    h("div", { class: "row" }, name, cmd),
    h("div", { class: "row" }, args),
    h("div", { class: "row" }, urlIn),
    h("div", { class: "small", text: "Environment variables (local servers — tokens, API keys)" }),
    envIn,
    h("div", { class: "small", text: "HTTP headers (remote servers — Authorization: Bearer …)" }),
    headersIn,
    h("div", { class: "row" }, addBtn),
    h("div", { class: "small", text: "Local server: fill command + args. Remote server: fill the URL (Streamable HTTP). Tokens go in the env or headers box. Pick a server above to pre-fill these fields." })));

  loadRegistry(false);
  pane.scrollTop = scroll;
}

async function loadFiles() {
  const pane = $("#pane-files");
  try {
    const list = await api("/api/files");
    pane.replaceChildren(
      h("div", { class: "row" },
        h("button", { text: "Refresh", onclick: loadFiles }),
        h("button", { text: "Upload…", onclick: () => $("#fileIn").click() }),
        h("span", { class: "small", text: list.length + " file(s) in the workspace" })),
      h("div", { class: "files" }, ...list.map(f => h("div", { class: "f" },
        h("span", { title: f.path, text: f.path }),
        h("span", { class: "small", text: f.size > 1048576
          ? (f.size / 1048576).toFixed(1) + " MB"
          : Math.max(1, Math.round(f.size / 1024)) + " KB" }),
        h("a", { href: "/api/file?path=" + encodeURIComponent(f.path), text: "download" })))));
  } catch (e) { pane.textContent = e.message; }
}

function uploadOne(file) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload?name=" + encodeURIComponent(file.name));
    xhr.setRequestHeader("X-Omni", "1");
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && file.size > 2 * 1024 * 1024) {
        const pct = Math.round(100 * e.loaded / e.total);
        toast(`Uploading ${file.name}: ${pct}%`, 700);
      }
    };
    xhr.onload = () => {
      if (xhr.status === 200) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch (_) { reject(new Error("bad response")); }
      } else {
        let msg = `HTTP ${xhr.status}`;
        try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {}
        reject(new Error(msg));
      }
    };
    xhr.onerror = () => reject(new Error("network error"));
    xhr.send(file);
  });
}

async function upload(files) {
  for (const f of files) {
    try {
      const d = await uploadOne(f);
      const cur = $("#inp").value;
      $("#inp").value = cur + (cur && !cur.endsWith(" ") ? " " : "") + `[file in workspace: ${d.path}] `;
      autoGrow();
      toast("Uploaded " + d.path);
    } catch (e) { toast("Upload failed: " + e.message, 5000); }
  }
  loadFiles();
}

/* ------------------------------------------------------------------
   Large paste handling.

   Pasting a large block of text (a log dump, a document, 500 KB of JSON)
   used to freeze the browser: the textarea grew, every line got a DOM
   node in the bubble, and the full text was sent to the model on every
   subsequent turn. Now anything over LARGE_PASTE_CHARS is intercepted at
   paste time, uploaded as a file in the workspace, and only a short
   reference ("[pasted text attached as pasted-...txt]") goes in the
   prompt. The agent reads the file with read_file if it needs the
   content. Small pastes behave exactly as before.
   ------------------------------------------------------------------ */
const LARGE_PASTE_CHARS = 20000;   // ~20 KB

$("#inp").addEventListener("paste", async e => {
  const cd = e.clipboardData || window.clipboardData;
  const txt = cd ? cd.getData("text") : "";
  if (!txt || txt.length < LARGE_PASTE_CHARS) return;    // normal paste — let it through
  e.preventDefault();                                     // don't insert 500 KB into the textarea

  const name = `pasted-${Date.now()}.txt`;
  toast(`Large paste (${Math.round(txt.length / 1024)} KB) — attaching as ${name}…`, 4000);
  try {
    const blob = new Blob([txt], { type: "text/plain" });
    const file = new File([blob], name, { type: "text/plain" });
    const d = await uploadOne(file);
    const inp = $("#inp");
    const ref = `[pasted text attached as ${d.path}]`;
    inp.value = (inp.value ? inp.value + " " : "") + ref + " ";
    inp.focus(); autoGrow();
    toast(`Attached ${d.path} (${Math.round(d.size / 1024)} KB)`);
    loadFiles();
  } catch (err) {
    toast("Attach failed: " + err.message, 5000);
  }
});

/* Drag-and-drop of *selected text* (not a file) from another app arrives
   as text/plain on dataTransfer. Same rule as paste: if it's large,
   upload it instead of stuffing it into the prompt. */
$("#inp").addEventListener("dragover", e => e.preventDefault());
$("#inp").addEventListener("drop", async e => {
  if (e.dataTransfer.files.length) {
    e.preventDefault();
    upload([...e.dataTransfer.files]);
    return;
  }
  const txt = e.dataTransfer.getData("text") || "";
  if (txt.length >= LARGE_PASTE_CHARS) {
    e.preventDefault();
    const name = `dropped-${Date.now()}.txt`;
    try {
      const file = new File([txt], name, { type: "text/plain" });
      const d = await uploadOne(file);
      const inp = $("#inp");
      inp.value += (inp.value ? " " : "") + `[dropped text attached as ${d.path}] `;
      autoGrow(); loadFiles();
      toast(`Attached ${d.path} (${Math.round(d.size / 1024)} KB)`);
    } catch (err) { toast("Attach failed: " + err.message, 5000); }
  }
});

/* ------------------------------------------------------------------
   Workspace picker.
   Improvements vs. the previous version:
     * editable path bar (paste a path, Enter to go),
     * native "Browse…" button that calls /api/workspace/pick (opens the
       OS folder dialog on the server, which is the same machine here),
     * Home goes to ~ (not the current workspace),
     * Up works at filesystem roots,
     * keyboard nav (arrows, Enter, Backspace),
     * keeps the hidden-files toggle between opens,
     * server rejects roots and data/ ancestors (same rule as the API).
   ------------------------------------------------------------------ */
let browseKeyHandler = null;
function openBrowser(startPath, cb) {
  document.getElementById("browse")?.remove();
  const overlay = h("div", { id: "browse",
    style: "position:fixed;inset:0;background:rgba(2,6,23,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px" });

  const crumbs = h("div", { class: "crumbs" });
  const recent = h("div", { class: "recent" });
  const listing = h("div", { class: "listing", tabindex: "0" });
  const filterIn = h("input", { placeholder: "Filter…", style: "flex:1" });
  const deepBox = h("input", { type: "checkbox" });
  const hiddenBox = h("input", { type: "checkbox" });
  hiddenBox.checked = store.get("omni_ws_hidden") === "1";
  hiddenBox.addEventListener("change", () => {
    store.set("omni_ws_hidden", hiddenBox.checked ? "1" : "0");
    go(curPath);
  });
  const drivesBox = h("div", { class: "row" });
  let allEntries = [];
  let curPath = "";
  let selIndex = -1;
  const history = [];

  const pathIn = h("input", {
    spellcheck: false, style: "flex:2;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px",
    "aria-label": "Current path",
  });
  pathIn.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); go(pathIn.value.trim() || curPath); }
  });

  function renderEntries() {
    const f = filterIn.value.toLowerCase();
    const filtered = f && !deepBox.checked
      ? allEntries.filter(en => en.name.toLowerCase().includes(f))
      : allEntries;
    listing.replaceChildren(...filtered.slice(0, 500).map((en, i) => {
      const row = h("div", { class: "f", title: en.path, tabindex: "0", "data-idx": i },
        h("span", { text: en.dir ? "📁" : "📄" }),
        h("span", { class: "nm", text: en.name }),
        en.dir ? null : h("span", { class: "small",
          text: Math.max(1, Math.round(en.size / 1024)) + " KB" }));
      row.addEventListener("click", () => {
        listing.querySelectorAll(".f.sel").forEach(x => x.classList.remove("sel"));
        row.classList.add("sel");
        selIndex = i;
      });
      row.addEventListener("dblclick", () => {
        if (en.dir) go(en.path);
      });
      row.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); if (en.dir) go(en.path); }
      });
      return row;
    }));
    selIndex = -1;
  }

  listing.addEventListener("keydown", e => {
    const rows = [...listing.querySelectorAll(".f")];
    if (!rows.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); selIndex = Math.min(rows.length - 1, selIndex + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); selIndex = Math.max(0, selIndex - 1); }
    else if (e.key === "Enter" && selIndex >= 0) { e.preventDefault(); rows[selIndex].dispatchEvent(new MouseEvent("dblclick")); return; }
    else return;
    rows.forEach((r, i) => r.classList.toggle("sel", i === selIndex));
    rows[selIndex].scrollIntoView({ block: "nearest" });
  });

  filterIn.addEventListener("input", () => {
    if (deepBox.checked) return;
    renderEntries();
  });
  deepBox.addEventListener("change", () => { if (deepBox.checked) go(curPath, true); });

  function setCrumbs(p) {
    crumbs.replaceChildren();
    const isWin = /^[A-Za-z]:[\\/]/.test(p);
    const parts = p.split(/[\\/]/).filter(Boolean);
    let acc = isWin ? "" : "/";
    const home = h("button", { class: "ghost", text: "🏠", title: "Home",
      "aria-label": "Home", onclick: () => go((S && S.home) || "") });
    crumbs.append(home);
    parts.forEach((part, i) => {
      if (i === 0 && isWin) acc = part + "\\";
      else if (isWin) acc = acc.replace(/\\?$/, "\\") + part;
      else acc = acc.replace(/\/?$/, "/") + part;
      const target = acc;
      const isLast = i === parts.length - 1;
      crumbs.append(h("span", { text: isWin ? "\\" : "/" }));
      crumbs.append(h("button", { class: "ghost crumb" + (isLast ? " cur" : ""), text: part,
        title: target, onclick: () => go(target) }));
    });
  }

  function renderRecent() {
    let rec = [];
    try { rec = JSON.parse(store.get("omni_recent_ws") || "[]"); } catch (_) { rec = []; }
    recent.replaceChildren(
      rec.length ? h("span", { class: "small", text: "Recent:" }) : null,
      ...rec.slice(0, 6).map(r =>
        h("button", { class: "ghost", title: r,
          text: r.split(/[\\/]/).filter(Boolean).pop() || r,
          onclick: () => go(r) })),
      rec.length ? h("button", { class: "ghost small", text: "clear",
        onclick: () => { store.set("omni_recent_ws", "[]"); renderRecent(); } }) : null);
  }
  function pushRecent(p) {
    let rec = [];
    try { rec = JSON.parse(store.get("omni_recent_ws") || "[]"); } catch (_) { rec = []; }
    rec = [p, ...rec.filter(x => x !== p)].slice(0, 10);
    store.set("omni_recent_ws", JSON.stringify(rec));
    renderRecent();
  }

  async function go(p, deep = false) {
    if (curPath && curPath !== p) history.push(curPath);
    const q = new URLSearchParams({ path: p || "" });
    if (deep && filterIn.value.trim()) q.set("search", filterIn.value.trim());
    if (hiddenBox.checked) q.set("hidden", "1");
    try {
      const d = await api("/api/browse?" + q);
      curPath = d.path;
      pathIn.value = d.path;
      setCrumbs(d.path);
      allEntries = d.entries;
      renderEntries();
      drivesBox.replaceChildren(...(d.drives || []).map(dr =>
        h("button", { text: dr, onclick: () => go(dr) })));
    } catch (e) { toast(e.message); }
  }

  const backBtn = h("button", { text: "←", title: "Back", "aria-label": "Back",
    onclick: () => { if (history.length) go(history.pop()); } });

  const upBtn = h("button", { text: "⬆ Up", title: "Parent folder",
    onclick: () => {
      const p = (curPath || "").replace(/[\\/]+$/, "");
      const isWin = /^[A-Za-z]:$/.test(p);
      const up = isWin ? p + "\\" : (p.replace(/[\\/][^\\/]*$/, "") || (osWinPath() ? "C:\\" : "/"));
      go(up);
    } });

  const browseBtn = h("button", { text: "📂 Browse…", title: "Open the OS folder picker on this machine",
    onclick: async () => {
      toast("Opening the folder picker on the Omni machine…");
      try {
        const r = await api("/api/workspace/pick", {});
        if (r.cancelled) return;
        pushRecent(r.workspace);
        toast("Workspace changed to " + r.workspace);
        overlay.remove();
        cleanupKeyHandler();
        if (cb) { /* caller refreshes */ }
        await refreshKeys(true);
      } catch (e) { toast(e.message, 6000); }
    } });

  const useBtn = h("button", { class: "primary", text: "Use this folder",
    onclick: async () => {
      if (!curPath) return toast("Still loading the folder — try again in a moment");
      const ok = await confirmDlg(
        "Change workspace?",
        `Make "${curPath}" the workspace?\n\nFiles under this folder will be treated as "inside" and won't prompt for approval when the agent writes to them.`,
        "Use this folder");
      if (!ok) return;
      try {
        if (cb) await cb(curPath);
        pushRecent(curPath);
        overlay.remove();
        cleanupKeyHandler();
      } catch (e) { toast(e.message, 6000); }
    } });

  const pathBar = h("div", { class: "row" },
    backBtn, upBtn, pathIn, browseBtn, useBtn);

  const dlg = h("div", { class: "dlg" },
    h("h3", { style: "margin:0 0 12px !important;font-size:16px", text: "Choose workspace" }),
    recent,
    pathBar,
    h("div", { class: "row", style: "margin-top:6px" }, crumbs),
    h("div", { class: "row", style: "margin-top:6px" },
      filterIn,
      h("label", { class: "tog" }, deepBox, " deep search"),
      h("label", { class: "tog" }, hiddenBox, " hidden")),
    drivesBox,
    listing,
    h("div", { class: "row", style: "justify-content:flex-end;margin-top:12px" },
      h("button", { text: "Cancel", onclick: () => { overlay.remove(); cleanupKeyHandler(); } })));
  overlay.append(dlg);
  overlay.onclick = e => { if (e.target === overlay) { overlay.remove(); cleanupKeyHandler(); } };
  document.body.append(overlay);
  renderRecent();
  go(startPath || (S && S.workspace) || "");

  browseKeyHandler = e => { if (e.key === "Escape") { overlay.remove(); cleanupKeyHandler(); } };
  document.addEventListener("keydown", browseKeyHandler);
  function cleanupKeyHandler() {
    if (browseKeyHandler) { document.removeEventListener("keydown", browseKeyHandler); browseKeyHandler = null; }
  }
}
function osWinPath() { return /^[A-Za-z]:[\\/]/.test((S && S.workspace) || ""); }

function copyText(t) { navigator.clipboard.writeText(t); toast("Copied to clipboard"); }
async function retryMsg(e, ev) {

  try {
    const r = await api("/api/chat/edit", { session: sid, index: ev.idx, text: newText.trim() });

  } catch (e) { toast(e.message); }

  catch (e) { toast(e.message); }
}

  if (tab === "files") loadFiles();
  else if (tab === "mcp") { refreshKeys(true); renderMcp(); }
  else refreshKeys(true);
}
$("#keysBtn").onclick = () =>
  $("#app").classList.contains("rightopen")
    ? $("#app").classList.remove("rightopen")
    : openRight("keys");
$("#closeRight").onclick = () => $("#app").classList.remove("rightopen");
document.querySelectorAll(".tabs [data-tab]").forEach(b =>
  b.onclick = () => openRight(b.dataset.tab));

$("#routeChip").onclick = () => {
  if (!lastRoute) return toast("No request yet");
  toast(`${lastRoute.pool} · key ${lastRoute.provider} · ${lastRoute.model}` +
        (lastRoute.fallback ? ` (fallback: ${lastRoute.reason})` : ""), 5000);
};

$("#wsChip").addEventListener("click", () => {
  openBrowser((S && S.workspace) || "", async (p) => {
    const r = await api("/api/workspace/set", { path: p });
    // Update the chip immediately from the authoritative server response,
    // then re-read the full state so anything else that depends on the
    // workspace is consistent too.
    if (S) S.workspace = r.workspace;
    $("#wsChip").replaceChildren("workspace: ", h("b", { text: r.workspace }));
    toast("Workspace changed to " + r.workspace);
    await refreshKeys(true);
  });
});

(async function init() {
  await refreshKeys(true); await loadChat(); loadSessions();
  if (S) {
    $("#strictBox").checked = !!S.strict;
    $("#strictTog").classList.toggle("on", !!S.strict);
  }
  if (S && !S.pools.length) { openRight("keys"); toast("Add your first API key to start"); }
})();
</script>
</body>
