<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23c2410c'/%3E%3Cstop offset='1' stop-color='%23ea580c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf9f6; --bg-2:#f2f0eb;
  --panel:#ffffff; --panel-2:#fcfbf8;
  --ink:#1a1815; --ink-2:#45403a;
  --muted:#7a7268; --muted-2:#a8a094;
  --line:#e8e4dc; --line-2:#d6d0c4;
  --accent:#c2410c; --accent-2:#ea580c;
  --accent-ink:#ffffff;
  --accent-soft:#fef3ec; --accent-soft-2:#fed7c3;
  --ok:#0d9488; --warn:#b45309; --bad:#b91c1c;
  --user:#eef0ff; --user-line:#d8dcff;
  --tool:#f1f5f9; --code:#1c1917; --code-ink:#e7e5e4;
  --warn-bg:color-mix(in srgb,#b45309 12%,transparent);
  --bad-bg:color-mix(in srgb,#dc2626 10%,transparent);
  --ok-bg:color-mix(in srgb,#059669 10%,transparent);
  --accent-bg:color-mix(in srgb,var(--accent) 12%,transparent);
  --e1:0 1px 2px rgba(26,24,21,.04), 0 1px 1px rgba(26,24,21,.03);
  --e2:0 2px 4px rgba(26,24,21,.05), 0 4px 12px -2px rgba(26,24,21,.06);
  --e3:0 4px 8px rgba(26,24,21,.06), 0 12px 32px -8px rgba(26,24,21,.10);
  --e4:0 8px 16px rgba(26,24,21,.08), 0 32px 64px -16px rgba(26,24,21,.20);
  --radius-sm:6px; --radius:10px; --radius-lg:14px; --radius-xl:18px;
  --font-sans:system-ui,-apple-system,"Segoe UI Variable","Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono","Cascadia Code",ui-monospace,Menlo,monospace;
  --sb-thumb:#cbd5e1; --sb-thumb-hover:#94a3b8; --sb-track:transparent;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14110e; --bg-2:#1c1815;
  --panel:#1f1b17; --panel-2:#252019;
  --line:#2e2823; --line-2:#3f372f;
  --ink:#f5f1ea; --ink-2:#d6cec3;
  --muted:#9a8f82; --muted-2:#6b6055;
  --accent:#fb923c; --accent-2:#fdba74;
  --accent-ink:#14110e;
  --accent-soft:#2a1f14; --accent-soft-2:#3f2e1c;
  --ok:#2dd4bf; --warn:#fbbf24; --bad:#f87171;
  --user:#1e1b2e; --user-line:#2e2950;
  --tool:#0f1621; --code:#0f0d0b; --code-ink:#e7e5e4;
  --warn-bg:color-mix(in srgb,#fbbf24 14%,transparent);
  --bad-bg:color-mix(in srgb,#f87171 14%,transparent);
  --ok-bg:color-mix(in srgb,#34d399 14%,transparent);
  --accent-bg:color-mix(in srgb,var(--accent) 18%,transparent);
  --sb-thumb:#334155; --sb-thumb-hover:#475569;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:14.5px/1.65 var(--font-sans);letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) var(--sb-track)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--sb-track)}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-hover);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}

button,input,select,textarea{font:inherit;color:inherit}
button{
  cursor:pointer;border:1px solid var(--line);background:var(--panel);
  border-radius:var(--radius-sm);padding:6px 12px;font-weight:500;
  transition:border-color .15s,box-shadow .15s,transform .1s,background .15s,color .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;box-shadow:var(--e1);
}
button:hover:not(:disabled){border-color:var(--line-2);background:var(--panel-2);box-shadow:var(--e2);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{
  background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;
  box-shadow:0 1px 2px rgba(194,65,12,.2),inset 0 1px 0 rgba(255,255,255,.15);
}
button.primary:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
button.danger{color:var(--bad)}
button.danger:hover:not(:disabled){background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
button.ghost{border-color:transparent;background:transparent;box-shadow:none}
button.ghost:hover:not(:disabled){background:var(--bg-2);box-shadow:none;transform:none}
button.auto-btn{
  border-color:color-mix(in srgb,var(--accent) 40%,var(--line));
  background:var(--accent-bg);color:var(--accent);font-weight:600;
}
button.auto-btn:hover:not(:disabled){border-color:var(--accent)}
button.auto-btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

input,select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:7px 10px;min-width:0;transition:border-color .15s,box-shadow .15s;
}
input:hover,select:hover,textarea:hover{border-color:var(--line-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
input[type="checkbox"]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}

#app{display:grid;grid-template-columns:260px minmax(0,1fr) 0;height:100vh;height:100dvh;transition:grid-template-columns .25s ease}
#app.leftcollapsed{grid-template-columns:0 minmax(0,1fr) 0}
#app.leftcollapsed.rightopen{grid-template-columns:0 minmax(0,1fr) 440px}
#app.rightopen{grid-template-columns:260px minmax(0,1fr) 440px}

aside{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
  position:relative;z-index:6;
}
#right{border-right:0;border-left:1px solid var(--line)}
#left-toggle{position:absolute;top:14px;right:10px;z-index:5;padding:4px;border:0;background:none;opacity:.4;cursor:pointer;transition:opacity .15s;box-shadow:none}
#left-toggle:hover{opacity:1}
/* The "expand sidebar" ☰ button. Visible ONLY while #app has .leftcollapsed
   and the viewport is not the mobile-drawer breakpoint (where the sidebar
   is already a drawer and #left-toggle is reachable). */
#expand-left{position:fixed;top:14px;left:10px;z-index:5;display:none}
#app.leftcollapsed #expand-left{display:block}
@media (max-width:767px){
  /* On phones the collapsed state is not used; hide it to avoid two ☰. */
  #app.leftcollapsed #expand-left{display:none}
}
#app.leftcollapsed header{padding-left:56px}
#expand-left:hover{background:var(--bg-2)}

.brand{display:flex;align-items:center;gap:10px;padding:16px 36px 10px 16px;font-weight:700;font-size:16px;letter-spacing:-.01em;flex:none}
.brand i{width:24px;height:24px;border-radius:8px;background:var(--accent);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;inset:6px;border:2.5px solid var(--accent-ink);border-radius:50%}

.side-section{padding:0 12px 10px;flex:none}
#newChat{width:100%;justify-content:flex-start;padding:9px 12px;font-weight:600}
#newChat::before{content:"+";font-size:16px;line-height:1;margin-right:2px}
#sessSearch{width:100%;font-size:12.5px;padding:6px 9px;background:var(--bg)}

.side-label{
  font-size:11px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;
  font-weight:600;padding:10px 12px 4px;flex:none;
}
.scroll-sec{
  min-height:40px;overflow-y:auto;overflow-x:hidden;
  padding:0 6px 8px;scrollbar-gutter:stable;
}
.scroll-sec.shells{flex:0 1 auto;max-height:28%}
.scroll-sec.sessions{flex:1 1 auto;min-height:0}

.sess{
  display:flex;align-items:center;gap:6px;border-radius:var(--radius-sm);
  padding:7px 10px;cursor:pointer;color:var(--ink-2);
  transition:background .12s,color .12s;position:relative;
}
.sess:hover{background:var(--bg)}
.sess.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.sess.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.sess .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .t{font-size:11px;color:var(--muted-2);margin-left:auto;font-variant-numeric:tabular-nums}
.sess button{opacity:0;padding:2px 5px;border:0;background:none;color:var(--muted);border-radius:4px;transition:opacity .15s,background .15s;box-shadow:none}
.sess:hover button,.sess:focus-within button{opacity:1}
.sess button:hover{background:var(--bad-bg);color:var(--bad)}
.sess button[aria-label="Rename chat"]:hover{background:var(--accent-soft);color:var(--accent)}

main{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1}

header{
  display:flex;align-items:center;gap:8px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel);
  flex-wrap:wrap;position:relative;z-index:4;
}
header .sp{flex:1}

.chip{
  border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  font-size:12px;color:var(--muted);background:var(--bg);
  white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer;transition:border-color .15s,color .15s,background .15s;
  display:inline-flex;align-items:center;gap:6px;
}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.7;flex:none}
#routeChip::before{background:var(--ok)}
.chip:hover{border-color:var(--accent);color:var(--ink);background:var(--panel)}
.chip b{color:var(--ink);font-weight:600}

.toggle-group{
  display:inline-flex;align-items:center;border:1px solid var(--line);
  border-radius:999px;background:var(--bg);padding:2px;gap:0;
}
label.tog{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;
  color:var(--muted);cursor:pointer;padding:3px 10px;border-radius:999px;
  transition:background .15s,color .15s;user-select:none;
}
label.tog:hover{color:var(--ink-2)}
label.tog.on.strict{background:var(--warn-bg);color:var(--warn);font-weight:600}
label.tog.on.auto{background:var(--bad-bg);color:var(--bad);font-weight:600}
label.tog.on.bg{background:var(--ok-bg);color:var(--ok);font-weight:600}
label.tog input{display:none}

#autoBanner{display:none;padding:8px 16px;background:var(--bad-bg);color:var(--bad);border-bottom:1px solid color-mix(in srgb,var(--bad) 30%,transparent);font-size:12.5px;font-weight:600;text-align:center}
#autoBanner.on{display:block}

#log{flex:1;overflow:auto;padding:20px 0 12px;scroll-behavior:smooth}
.col{max-width:880px;margin:0 auto;padding:0 24px}

.msg{margin:12px 0;display:flex;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end;flex-direction:column;align-items:flex-end}
.msg.asst{flex-direction:column;align-items:flex-start}

.bubble{padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word;line-height:1.65}
.user .bubble{background:var(--user);border-bottom-right-radius:4px;border:1px solid var(--user-line)}
.asst .bubble{
  background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;
  white-space:normal;max-width:100%;box-shadow:var(--e1);border-radius:16px;
}
.asst .bubble:hover{box-shadow:var(--e2);border-color:var(--line-2)}
.asst.mid .bubble{box-shadow:none;color:var(--muted);background:transparent;border-style:dashed}
.bubble p{margin:.5em 0} .bubble p:first-child{margin-top:0} .bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:.5em 0;padding-left:1.5em}
.bubble li{margin:.2em 0}
.bubble h1,.bubble h2,.bubble h3{margin:.7em 0 .3em;font-size:1.05em;letter-spacing:-.01em}
.bubble code{background:var(--tool);padding:1px 6px;border-radius:5px;font:12.5px var(--font-mono)}
.bubble pre{background:var(--code);color:var(--code-ink);padding:12px 14px;border-radius:var(--radius);overflow:auto;margin:.6em 0;font-size:12.5px;line-height:1.55;max-width:100%;min-width:0}
.bubble pre code{background:none;padding:0;color:inherit;font-size:inherit}

.tool{margin:6px 0;background:var(--tool);border-radius:var(--radius);border:1px solid var(--line);border-left:3px solid var(--muted-2);font-size:12.5px;transition:border-left-color .15s}
.tool[data-status="ok"]{border-left-color:var(--ok)}
.tool[data-status="bad"]{border-left-color:var(--bad)}
.tool[data-status="run"]{border-left-color:var(--warn)}
.tool summary{padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none;border-radius:var(--radius);flex-wrap:wrap}
.tool summary:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.tool summary::-webkit-details-marker{display:none}
.tool summary .n{font-weight:600;color:var(--ink)}
.tool summary .a{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:var(--font-mono);font-size:12px}
.tool summary .d{font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:4px;background:var(--panel);border:1px solid var(--line)}
.tool .st{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--muted-2) 20%,transparent)}
.tool .st.ok{background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 20%,transparent)}
.tool .st.bad{background:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 20%,transparent)}
.tool[data-status="run"] .st{animation:pulse 1.2s infinite;background:var(--warn)}
.tool pre{
  margin:0;padding:12px 14px;border-top:1px solid var(--line);overflow:auto;
  max-height:280px;white-space:pre-wrap;word-break:break-word;
  font:12.5px/1.55 var(--font-mono);background:var(--code);color:var(--code-ink);
  border-radius:0 0 12px 12px;
}

.note{margin:8px 0;font-size:12.5px;color:var(--warn);padding-left:6px}
.note.err{color:var(--bad);background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap}
.note.verify{color:var(--warn);background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap;margin:8px 0}

.empty{max-width:760px;margin:6vh auto 0;text-align:center;color:var(--muted);padding:0 16px}
.empty h2{color:var(--ink);margin:0 0 12px;font-size:clamp(20px,3vw,32px);font-weight:700;letter-spacing:-.03em}
.empty h2::before{content:"✨  ";font-weight:400}
.empty .ex{display:grid;grid-template-columns:1fr;gap:12px;margin-top:24px;text-align:left}
@media (min-width:600px){.empty .ex{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.empty .ex button{
  padding:18px 20px;text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;
  gap:2px;white-space:normal;box-shadow:var(--e1);word-break:break-word;
}
.empty .ex button:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 24px -8px color-mix(in srgb, var(--accent) 40%, transparent);background:var(--panel)}
.empty .ex .t{font-weight:600;font-size:13.5px;color:var(--ink)}
.empty .ex .s{font-size:12px;color:var(--muted);line-height:1.5}

#composer{padding:12px 0 20px;background:var(--bg);border-top:1px solid var(--line);position:relative}
#composer .col{position:relative}
.box{display:flex;gap:10px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:10px;box-shadow:var(--e1);transition:border-color .15s,box-shadow .15s}
.box:focus-within{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent), var(--e1)}
.box textarea{flex:1;min-width:0;border:0;resize:none;max-height:220px;padding:8px 4px;background:transparent;line-height:1.55;font-size:16px}
.box textarea:focus{outline:none;box-shadow:none;border-color:transparent}
#attach{padding:8px 10px;border-radius:var(--radius-sm);font-size:16px;background:transparent;border:0}
#attach:hover{background:var(--bg-2)}
#send,#stop{padding:8px 16px;border-radius:var(--radius-sm)}

#micBtn{padding:8px 10px;border-radius:var(--radius-sm);font-size:16px;background:transparent;border:0}
#micBtn:hover{background:var(--bg-2)}
#micBtn.rec{background:var(--bad-bg);color:var(--bad);animation:pulse 1.2s infinite}

.status{margin:0 0 8px}
.status-card{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--e1)}
.status-card .title{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:4px}
.status-card .title .spin{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.status-card .detail{color:var(--muted);font-size:12.5px}
.status-card ul{margin:8px 0 0;padding-left:1.2em;color:var(--muted);font-size:12px;max-height:120px;overflow:auto}
.status-card .foot{display:flex;justify-content:flex-end;margin-top:8px}

.typing .bubble{display:flex;gap:4px;padding:14px 18px}
.typing .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typing 1.4s infinite ease-in-out}
.typing .dot:nth-child(2){animation-delay:.15s}
.typing .dot:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.msg-actions{display:flex;gap:6px;margin-top:6px;opacity:0;pointer-events:none;transition:opacity .2s}
.msg:hover .msg-actions,.msg:focus-within .msg-actions{opacity:1;pointer-events:auto}
@media (hover:none){.msg-actions{opacity:1}}
.msg-actions button{padding:3px 9px;font-size:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:var(--radius-sm);transition:all .2s;font-weight:500;box-shadow:none}
.msg-actions button:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.copy-code{position:absolute;top:10px;right:10px;padding:3px 8px;font-size:11px;opacity:0;transition:opacity .2s;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:var(--radius-sm);color:var(--code-ink);font-weight:500;box-shadow:none}
div:hover>.copy-code{opacity:1}
.copy-code:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel-2)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:12px 8px;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;transition:color .15s,border-color .15s,background .15s;box-shadow:none}
.tabs button:hover{color:var(--ink-2);background:var(--bg-2)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

.pane{overflow:auto;padding:14px;flex:1;display:none;background:var(--bg)}
.pane.on{display:block}

.card{border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:14px;background:var(--panel);box-shadow:var(--e1)}
.card h3{margin:0 0 10px;font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.card-hero{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--accent) 6%, var(--panel)),
    var(--panel) 80%);
  border:1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
  border-radius:16px;padding:20px;box-shadow:var(--e2);
}

.row{display:flex;gap:8px;margin:8px 0;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:0}
.row>label.tog{display:inline-flex}

.small{font-size:12px;color:var(--muted);line-height:1.5}

.badge{font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);font-weight:500;background:var(--bg);line-height:1.4}
.badge.g{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-bg)}
.badge.w{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-bg)}
.badge.r{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-bg)}
.badge.i{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-bg)}

.keys{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;max-height:320px;overflow:auto}
.k{display:flex;gap:8px;align-items:center;padding:6px 4px;font-size:12.5px;border-radius:var(--radius-sm);transition:background .12s}
.k:hover{background:var(--bg)}
.k .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 20%,transparent)}
.k .dot.rate,.k .dot.server,.k .dot.network{background:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 20%,transparent)}
.k .dot.quota{background:#ea580c;box-shadow:0 0 0 2px rgba(234,88,12,.2)}
.k .dot.auth,.k .dot.billing{background:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 20%,transparent)}
.k .nm{width:100px;font-weight:600;font-family:var(--font-mono);font-size:12px}
.k .mk{width:100px;color:var(--muted);font-family:var(--font-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.k .info{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.k button{padding:2px 8px;font-size:11.5px;min-height:24px}
.k input{padding:3px 8px;font-size:12px;max-width:200px;font-family:var(--font-mono)}

textarea.keysbox{width:100%;height:76px;font:12px var(--font-mono);line-height:1.5;resize:vertical}

.files .f{display:flex;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;align-items:center;border-radius:var(--radius-sm);transition:background .12s}
.files .f:hover{background:var(--bg)}
.files .f span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files a{color:var(--accent);text-decoration:none;font-weight:500}
.files a:hover{text-decoration:underline}

.mcp-card{border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:12px;background:var(--panel);box-shadow:var(--e1)}
.mcp-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mcp-hd .nm{font-weight:600;font-size:13.5px}
.mcp-hd .tools{color:var(--muted);font-size:12px}
.mcp-meta{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-all}
.mcp-form{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.mcp-form label{font-size:11.5px;color:var(--muted);font-weight:500}
.mcp-form input,.mcp-form textarea{width:100%}
.mcp-form textarea{font:12px var(--font-mono);min-height:64px;resize:vertical}
.mcp-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.mcp-reg{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2);margin-top:8px}
.mcp-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.mcp-row:last-child{border-bottom:0}
.mcp-row:hover{background:var(--bg)}
.mcp-row.sel{background:var(--accent-soft)}
.mcp-row .body{flex:1;min-width:0}
.mcp-row .t{font-weight:600;font-size:13px}
.mcp-row .d{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
.mcp-row .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}

#modal,#confirm{position:fixed;inset:0;background:rgba(20,17,14,.55);backdrop-filter:blur(8px) saturate(120%);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fadeIn .15s ease}
#modal.on,#confirm.on{display:flex}
#modal .dlg,#confirm .dlg{background:var(--panel);border-radius:var(--radius-xl);width:100%;padding:22px;box-shadow:var(--e4);border:1px solid var(--line);animation:pop .2s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#modal .dlg{max-width:640px}
#confirm .dlg{max-width:460px}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(4px)}to{opacity:1;transform:none}}
#modal h3,#confirm h3{margin:0 0 12px !important;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
#modal pre{background:var(--code);color:var(--code-ink);padding:14px;border-radius:var(--radius);overflow:auto;max-height:44vh;white-space:pre-wrap;word-break:break-word;font:12.5px var(--font-mono);line-height:1.55;min-width:0;min-height:0}
#confirm .msg{color:var(--ink-2);margin:0 0 20px;white-space:pre-wrap;line-height:1.6;font-size:13.5px}
#confirm .actions{display:flex;justify-content:flex-end;gap:8px}

#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;max-width:90vw;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius);opacity:0;transition:opacity .2s,transform .2s;max-width:90vw;font-size:13px;font-weight:500;box-shadow:var(--e4);transform:translateY(4px)}
.toast.on{opacity:1;transform:none}

#scrollDown{position:fixed;right:24px;bottom:130px;z-index:15;border-radius:999px;padding:8px 16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--e3);display:none;font-size:12px;font-weight:500}
#scrollDown.on{display:inline-flex}
#scrollDown:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

#browse .dlg{background:var(--panel);border-radius:var(--radius-xl);border:1px solid var(--line);padding:22px;width:100%;max-width:840px;box-shadow:var(--e4);display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.8,.2,1)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 0;font-size:12.5px;min-width:0}
.crumbs .crumb{padding:2px 8px;border-radius:var(--radius-sm);font-size:12.5px}
.crumbs .crumb.cur{color:var(--ink);font-weight:600;background:var(--accent-soft)}
.recent{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0;align-items:center}
.recent button{padding:3px 10px;font-size:12px}
#browse .listing{max-height:48vh;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel-2)}
#browse .listing .f{display:flex;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;align-items:center;transition:background .1s}
#browse .listing .f:last-child{border-bottom:0}
#browse .listing .f:hover{background:var(--bg)}
#browse .listing .f.sel{background:var(--accent-soft);color:var(--ink)}
#browse .listing .f:focus{outline:2px solid var(--accent);outline-offset:-2px}
#browse .listing .f .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:1023px){
  #app,#app.rightopen{grid-template-columns:240px minmax(0,1fr) 0}
  #right{
    position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);max-width:100%;
    transform:translateX(100%);
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
    z-index:20;box-shadow:var(--e4);border-left:1px solid var(--line);
  }
  #app.rightopen #right{transform:none}
}
@media (max-width:767px){
  #app,#app.rightopen,#app.leftcollapsed{grid-template-columns:minmax(0,1fr) 0}
  /* On phones the collapsed state is unused; make sure the ☰ is not shown. */
  #app.leftcollapsed #expand-left{display:none !important}
  #left{
    position:fixed;top:0;left:0;bottom:0;width:min(300px,88vw);max-width:100%;
    transform:translateX(-100%);
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
    z-index:20;box-shadow:var(--e4);
  }
  #app.leftopen #left{transform:none}
  #right{width:100%;max-width:100%}
  .col{padding:0 12px}
  header{padding:10px 12px 10px 52px}
  .bubble{max-width:92%}
  #scrollDown{bottom:100px;right:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <button id="left-toggle" title="Collapse sidebar" aria-label="Collapse sidebar">◀</button>
    <div class="brand"><i></i> Omni</div>
    <div class="side-section"><button class="primary" id="newChat">New chat</button></div>
    <div class="side-section"><input id="sessSearch" placeholder="Search chats…" aria-label="Search chats"></div>
    <div class="side-label" style="display:flex;align-items:center;gap:6px">
      <span>Shell jobs</span>
      <span style="flex:1"></span>
      <button id="killAllShells" class="ghost" title="Stop every running background shell"
              aria-label="Stop all background shells" style="font-size:11px;padding:1px 6px">stop all</button>
    </div>
    <div id="shelljobs" class="scroll-sec shells"></div>
    <div class="side-label">Recent</div>
    <div id="sessions" class="scroll-sec sessions"></div>
  </aside>

  <main>
    <button id="expand-left" class="ghost" title="Expand sidebar" aria-label="Expand sidebar">☰</button>
    <header>
        <button class="chip" id="wsChip" title="Click to change the agent's workspace (browse your entire PC)"></button>
      <button class="chip" id="routeChip" title="Click for the full route (pool, model, key)">no request yet</button>
      <span class="sp"></span>
      <div class="toggle-group">
        <label class="tog strict" id="strictTog" title="Verify factual claims in answers"><input type="checkbox" id="strictBox"> strict</label>
        <label class="tog auto" id="autoTog" title="When on, the agent runs shell commands and writes outside the workspace without asking"><input type="checkbox" id="autoBox"> auto-approve</label>
        <label class="tog bg" id="bgTog" title="When on, every run_shell call executes in the background (survives Stop)"><input type="checkbox" id="bgBox"> bg-shell</label>
      </div>
      <button id="diagBtn" class="ghost" title="Show backend diagnostics (logs)" aria-label="Diagnostics">🩺</button>
      <button id="keysBtn" class="primary">Keys &amp; models</button>
    </header>
    <div id="autoBanner">⚠ auto-approve is ON — the agent runs shell commands and writes files without asking. Turn it off in the header.</div>
    <div id="log"><div class="col" id="msgs"></div></div>
    <button id="scrollDown" title="Jump to latest message">↓ new messages</button>
    <div id="composer"><div class="col">
        <div id="working"></div>
        <div id="liveTimer" style="display:none;align-items:center;gap:10px;margin:0 0 8px;
             padding:6px 12px;border:1px solid var(--line);border-radius:999px;
             background:var(--panel);font-size:12.5px;color:var(--muted);
             font-variant-numeric:tabular-nums">
          <span class="spin" style="width:8px;height:8px;border-radius:50%;
                background:var(--accent);animation:pulse 1.2s infinite;display:inline-block"></span>
          <span id="liveStage" style="color:var(--ink);font-weight:600">Working…</span>
          <span style="flex:1"></span>
          <span id="liveElapsed" style="color:var(--accent);font-weight:600">0s</span>
        </div>
      <div class="box">
        <button class="ghost" id="micBtn" title="Dictate (local STT — requires sherpa-onnx + a microphone)" aria-label="Dictate">🎤</button>
        <button class="ghost" id="attach" title="Upload a file into the workspace" aria-label="Upload a file">📎</button>
        <input type="file" id="fileIn" hidden multiple>
        <textarea id="inp" rows="1" placeholder="Ask Omni to read, edit, run, research…  (Enter = send, Shift+Enter = new line)"></textarea>
        <button class="primary" id="send">Send</button>
        <button class="danger" id="stop" style="display:none">Stop</button>
      </div>
    </div></div>
  </main>

  <aside id="right">
    <div class="tabs">
      <button class="on" data-tab="keys">Keys</button>
      <button data-tab="mcp">MCP</button>
      <button data-tab="files">Files</button>
      <button data-tab="memory">Memory</button>
      <button data-tab="skills">Skills</button>
      <button id="closeRight" style="flex:0 0 44px" aria-label="Close panel">✕</button>
    </div>
    <div class="pane on" id="pane-keys"></div>
    <div class="pane" id="pane-mcp"></div>
    <div class="pane" id="pane-files"></div>
    <div class="pane" id="pane-memory"></div>
    <div class="pane" id="pane-skills"></div>
  </aside>
</div>

<div id="modal"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <h3 id="modalTitle">Omni wants to do this</h3>
  <pre id="modalAction"></pre>
  <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)">
    <input type="checkbox" id="modalRemember"> Don't ask again for this tool this session
  </label>
  <div class="row" style="justify-content:flex-end;margin-top:14px">
    <button id="deny" class="danger">Deny</button>
    <button id="allow" class="primary">Allow</button>
  </div>
</div></div>

<div id="confirm"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <h3 id="confirmTitle">Confirm</h3>
  <div class="msg" id="confirmMsg"></div>
  <div class="actions">
    <button id="confirmNo">Cancel</button>
    <button id="confirmYes" class="primary">OK</button>
  </div>
</div></div>

<div id="toasts"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k in el && k !== "list" && k !== "form") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false)
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function toast(t, ms = 2800) {
  const e = h("div", { class: "toast", text: t });
  $("#toasts").append(e);
  requestAnimationFrame(() => e.classList.add("on"));
  setTimeout(() => { e.classList.remove("on"); setTimeout(() => e.remove(), 300); }, ms);
}
async function api(path, body, opt = {}) {
  const init = body === undefined && !opt.post
    ? { headers: { "X-Omni": "1" } }
    : { method: "POST", headers: { "X-Omni": "1", "Content-Type": "application/json" },
        body: JSON.stringify(body || {}) };
  const r = await fetch(path, init);
  if (r.status === 401) { toast("Session expired — reopen the link printed in the terminal", 6000); throw new Error("not authorised"); }
  let d = {}; try { d = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
};

/* Focus preservation */
function _focusKey(el) {
  if (!el || el === document.body || el === document.documentElement) return null;
  if (el.id) return { kind: "id", key: el.id };
  if (el.dataset && el.dataset.persist) return { kind: "persist", key: el.dataset.persist };
  if (el.classList && el.classList.contains("sess")) {
    return { kind: "sess", key: el.querySelector(".nm")?.textContent || "" };
  }
  return null;
}
function _findByFocusKey(fk) {
  if (!fk) return null;
  if (fk.kind === "id") return document.getElementById(fk.key);
  if (fk.kind === "persist") {
    return document.querySelector(`[data-persist="${fk.key.replace(/"/g, '\\"')}"]`);
  }
  return null;
}
let _focusRestore = null;
function withFocus(fn) {
  const el = document.activeElement;
  const fk = _focusKey(el);
  const selStart = el && typeof el.selectionStart === "number" ? el.selectionStart : null;
  const selEnd = el && typeof el.selectionEnd === "number" ? el.selectionEnd : null;
  try { return fn(); }
  finally {
    _focusRestore = { fk, selStart, selEnd };
    requestAnimationFrame(() => {
      const r = _focusRestore;
      _focusRestore = null;
      if (!r || !r.fk) return;
      const target = _findByFocusKey(r.fk);
      if (!target || target === document.activeElement) return;
      try {
        target.focus({ preventScroll: true });
        if (r.selStart != null && typeof target.setSelectionRange === "function") {
          target.setSelectionRange(r.selStart, r.selEnd ?? r.selStart);
        }
      } catch (_) {}
    });
  }
}
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)),
  b => b.toString(16).padStart(2, "0")).join("");

function inline(text) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    const t = m[0];
    if (t[0] === "`") frag.append(h("code", { text: t.slice(1, -1) }));
    else if (t.startsWith("**")) frag.append(h("b", { text: t.slice(2, -2) }));
    else {
      const mm = /\[([^\]]+)\]\(([^)]+)\)/.exec(t);
      const url = /^https?:\/\//i.test(mm[2]) ? mm[2] : "#";
      frag.append(h("a", { href: url, target: "_blank", rel: "noopener noreferrer", text: mm[1] }));
    }
    last = m.index + t.length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}
function md(src) {
  const root = document.createElement("div");
  const parts = String(src).split(/```/);
  parts.forEach((part, i) => {
    if (i % 2) {
      const body = part.replace(/^[^\n]*\n/, "");
      const code = h("code", { text: body.replace(/\n$/, "") });
      const pre = h("pre", {}, code);
      const copyBtn = h("button", { class: "copy-code", text: "Copy", onclick: () => copyText(code.textContent) });
      root.append(h("div", { style: "position:relative" }, pre, copyBtn));
      return;
    }
    let list = null;
    for (const para of part.split(/\n{2,}/)) {
      const lines = para.split("\n");
      for (const ln of lines) {
        let m;
        if ((m = /^\s*([-*]|\d+\.)\s+(.*)/.exec(ln))) {
          const tag = /\d/.test(m[1]) ? "ol" : "ul";
          if (!list || list.tagName.toLowerCase() !== tag) { list = h(tag); root.append(list); }
          list.append(h("li", {}, inline(m[2])));
        } else if ((m = /^(#{1,3})\s+(.*)/.exec(ln))) {
          list = null; root.append(h("h" + m[1].length, {}, inline(m[2])));
        } else if (ln.trim()) {
          list = null;
          const last = root.lastChild;
          if (last && last.tagName === "P" && last.dataset.open) {
            last.append(document.createElement("br"), inline(ln));
          } else {
            const p = h("p", {}, inline(ln)); p.dataset.open = "1"; root.append(p);
          }
        }
      }
      list = null;
      if (root.lastChild && root.lastChild.dataset) delete root.lastChild.dataset.open;
    }
  });
  return root;
}

let sid = store.get("omni_sid") || rid(), cursor = 0, busy = false, polling = false;
let lastRoute = null;
store.set("omni_sid", sid);
const msgs = $("#msgs"), logEl = $("#log"), toolEls = {};
function atBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 140; }
function scrollToBottom() {
  logEl.scrollTop = logEl.scrollHeight;
  $("#scrollDown").classList.remove("on");
  const inp = $("#inp");
  if (inp) { try { inp.focus({ preventScroll: true }); } catch (_) {} }
}
function maybeShowScrollDown() { $("#scrollDown").classList.toggle("on", !atBottom()); }
logEl.addEventListener("scroll", maybeShowScrollDown);
$("#scrollDown").onclick = scrollToBottom;

function add(el) {
  const stick = atBottom();
  clearEmpty();
  msgs.append(el);
  if (stick) scrollToBottom();
  else maybeShowScrollDown();
  return el;
}
function clearEmpty() { const e = $("#emptyState"); if (e) e.remove(); }
function showEmpty() {
  const examples = [
    ["Summarise my Documents folder", "Lists files and reads the ones that matter (asks for approval).", "Summarise the files in my Documents folder (will ask for approval)"],
    ["Review the code here", "Reads the sources, runs the tests, writes REVIEW.md.", "Review the code here and write REVIEW.md"],
    ["Create a Word report from my notes", "Builds a .docx with headings, keeping your content.", "Create a Word report from my notes"],
    ["Clean up a spreadsheet", "Edits .xlsx cells in place without touching the layout.", "In report.xlsx set B2 to the sum of B3:B9"],
  ];
  msgs.append(h("div", { class: "empty", id: "emptyState" },
    h("h2", { text: "What should Omni work on?" }),
    h("div", { text: "Reads and edits code and Office files, runs commands, browses pages, and (if configured) talks to MCP servers. Full PC access with approval." }),
    h("div", { class: "ex" }, ...examples.map(([t, s, prompt]) =>
      h("button", { type: "button", onclick: () => { $("#inp").value = prompt; $("#inp").focus(); autoGrow(); } },
        h("div", { class: "t", text: t }),
        h("div", { class: "s", text: s }))))));
}

const KIND_LABEL = { rate:"rate-limited", auth:"invalid key", quota:"out of quota", model:"model unavailable",
  billing:"no credits", server:"service error", network:"network error", empty:"empty reply",
  param:"bad parameters", tools:"no tool support", fatal:"error" };
function humanizeRecent(list) {
  if (!list) return list;
  return list.map(line => {
    const m = /^(\S+) \[([^\]]+)\] -> (\S+)/.exec(line);
    if (!m) return line;
    return `${m[1]} (${m[2]}) ${KIND_LABEL[m[3]] || m[3]}`;
  });
}

function actionsFor(kind, ev) {
  const kids = [];
  if (kind === "user") {
    if (typeof ev.idx === "number") kids.push(h("button", { text: "Edit", onclick: (e) => editMsg(e, ev) }));
    kids.push(h("button", { text: "Copy", onclick: () => copyText(ev.text) }));
    if (typeof ev.idx === "number") kids.push(h("button", { text: "Delete", onclick: (e) => deleteMsg(e, ev) }));
  } else if (kind === "assistant") {
    kids.push(h("button", { text: "Retry", onclick: (e) => retryMsg(e, ev) }));
    kids.push(h("button", { text: "Copy", onclick: () => copyText(ev.text) }));
  } else if (kind === "final") {
    kids.push(h("button", { text: "Retry", onclick: (e) => retryMsg(e, ev) }));
    kids.push(h("button", { text: "Copy", onclick: () => copyText(ev.text) }));
    if (typeof ev.idx === "number") kids.push(h("button", { text: "Delete", onclick: (e) => deleteMsg(e, ev) }));
  }
  return h("div", { class: "msg-actions" }, ...kids);
}

function render(ev) {
  switch (ev.type) {
    case "user": return add(h("div", { class: "msg user" },
      h("div", { class: "bubble", text: ev.text }), actionsFor("user", ev)));
    case "assistant": return add(h("div", { class: "msg asst mid" }, h("div", { class: "bubble" }, md(ev.text)), actionsFor("assistant", ev)));
    case "final": return add(h("div", { class: "msg asst" }, h("div", { class: "bubble" }, md(ev.text)), actionsFor("final", ev)));
    case "tool": {
      let args = ev.text || "", pretty = args;
      try {
        const o = JSON.parse(args);
        pretty = JSON.stringify(o, null, 1);
        args = Object.entries(o).map(([k, v]) => k + "=" + (typeof v === "string" ? v : JSON.stringify(v)).replace(/\s+/g, " ")).join("  ");
      } catch (_) {}
      const t0 = performance.now();
      const d = h("details", { class: "tool", "data-status": "run" },
        h("summary", {}, h("span", { class: "st" }), h("span", { class: "n", text: ev.name }),
          h("span", { class: "a", text: args.slice(0, 160) }),
          h("span", { class: "d", "data-t0": String(t0) })),
        h("pre", { text: pretty }));
      if (ev.id) toolEls[ev.id] = d;
      return add(d);
    }
    case "tool_result": {
      const d = toolEls[ev.id]; if (!d) return;
      d.querySelector(".st").classList.add(ev.ok ? "ok" : "bad");
      d.dataset.status = ev.ok ? "ok" : "bad";
      const dt = d.querySelector(".d");
      if (dt && dt.dataset.t0) { const s = ((performance.now() - Number(dt.dataset.t0)) / 1000).toFixed(1); dt.textContent = s + "s"; }
      if (!d.querySelector("pre.stream")) d.append(h("pre", { text: ev.text }));
      else if (!ev.ok) d.append(h("pre", { text: "ERROR (see stream above):\n" + ev.text }));
      if ((ev.text || "").length >= 1500 && ev.id) {
        const a = h("a", {
          href: `/api/tool_result?session=${encodeURIComponent(sid)}&id=${encodeURIComponent(ev.id)}`,
          target: "_blank", rel: "noopener noreferrer",
          style: "display:inline-block;margin:6px 12px 10px;font-size:11.5px;color:var(--accent);text-decoration:none",
          text: "⤓ full output",
        });
        d.append(a);
      }
      return;
    }
    case "tool_stream": {
      const d = toolEls[ev.id]; if (!d) return;
      if (!d.open) d.open = true;
      let pre = d.querySelector("pre.stream");
      if (!pre) {
        pre = h("pre", { class: "stream" });
        pre.append(document.createTextNode(""));
        d.append(pre);
      }
      pre.firstChild.appendData(ev.text);
      const nearBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
      if (nearBottom) pre.scrollTop = pre.scrollHeight;
      if (atBottom()) scrollToBottom(); else maybeShowScrollDown();
      return;
    }
    case "notice": return add(h("div", { class: "note", text: "↪ " + ev.text }));
    case "progress": {
      updateStatus({ title: ev.title || "Working", detail: ev.detail,
                     recent: ev.recent, route: ev.route });
      if (ev.title) _setLiveStage(ev.title);
      if (typeof ev.elapsed === "number") {
        const el = $("#liveElapsed");
        if (el) el.textContent = ev.elapsed + "s";
      }
      return;
    }
    case "verify": return add(h("div", { class: "note verify", text: ev.text }));
    case "route": {
      lastRoute = ev;
      const c = $("#routeChip");
      c.replaceChildren("answering: ", h("b", { text: ev.text }));
      c.title = `pool=${ev.pool} · key=${ev.provider} · model=${ev.model} · reason=${ev.reason || "primary"}`;
      updateStatus({ route: ev.text });
      return;
    }
    case "error": {
      // Soft message only. Full diagnostics are in the terminal / log file
      // (openable via the "Diagnostics" link below).
      const el = add(h("div", { class: "note err" },
        h("div", { text: ev.text || "Something went wrong. Please try again." }),
        h("div", { style: "margin-top:6px;display:flex;gap:8px;flex-wrap:wrap" },
          h("button", { text: "Retry", onclick: (e) => retryMsg(e, {}) }),
          h("button", { text: "Diagnostics", onclick: () => openDiagnostics() }))));
      requestAnimationFrame(() => { try { $("#inp").focus({ preventScroll: true }); } catch (_) {} });
      return el;
    }
    case "approval": return askApproval(ev);
    case "approval_done": if (pendingApproval && pendingApproval.id === ev.id) closeModal(); return;
  }
}

async function poll() {
  if (polling) return; polling = true; let fails = 0;
  try {
    while (true) {
      let d;
      try { d = await api(`/api/poll?session=${sid}&after=${cursor}&wait=15`); fails = 0; }
      catch (e) {
        if (/not authorised|authoris/.test(e.message)) { toast("Session expired — reopen the link from the terminal"); setBusy(false); break; }
        if (++fails >= 5) { toast("Lost connection to the Omni server: " + e.message, 6000); setBusy(false); break; }
        await new Promise(r => setTimeout(r, Math.min(1000 * 2 ** fails, 8000)));
        continue;
      }
      cursor = d.next;
      let done = false;
      for (const ev of d.events) { if (ev.type === "user") continue; if (ev.type === "done") done = true; else render(ev); }
      if (done || (!d.busy && !d.events.length)) {
        setBusy(false);
        refreshKeys();
        loadSessions();
        loadShellJobs();
        requestAnimationFrame(() => { scrollToBottom(); });
        break;
      }
    }
  } finally { polling = false; }
}

  store.set("omni_draft_" + sid, "");

    render({ type: "user", text: t, idx: (typeof r.user_idx === "number" ? r.user_idx : undefined) });
    cursor = r.cursor;
    statusState = {};
    setBusy(true, false);
    poll();
  } catch (e) {
    inp.value = restore; autoGrow();
    render({ type: "error", text: e.message });
  }
}

let sttActive = false, sttCursor = 0, sttPollTimer = null;

async function sttRefreshStatus() {
  try {

    if (!d.ok) {

async function sttStart() {
  const inp = $("#inp");
  const startVal = inp.value;
  const sep = startVal && !startVal.endsWith(" ") ? " " : "";
  try {
    const d = await api("/api/stt/start", {});
    if (!d.ok) { toast("STT: " + (d.error || "unavailable"), 6000); return; }
  } catch (e) { toast("STT: " + e.message, 6000); return; }
  sttActive = true;
  sttCursor = 0;
  $("#micBtn").classList.add("rec");
  $("#micBtn").textContent = "⏹";
  toast("Listening… speak now (click the mic again to stop)", 4000);
  const pollOnce = async () => {
    if (!sttActive) return;
    try {
      const d = await api(`/api/stt/poll?after=${sttCursor}`);
      if (!d.active) { sttStop(true); return; }
      if (d.error) { toast("STT error: " + d.error, 6000); sttStop(true); return; }
      for (const ev of d.events) {
        sttCursor = Math.max(sttCursor, ev.t);
        if (ev.type === "partial") sttRenderPartial(inp, startVal + sep, ev.text);
        else if (ev.type === "final") {
          sttRenderPartial(inp, startVal + sep, "");
          inp.value = (startVal + sep + ev.text + " ").replace(/\s+$/, " ") + (startVal ? "" : "");
          autoGrow();
        }
      }
    } catch (e) {}
    if (sttActive) sttPollTimer = setTimeout(pollOnce, 200);
  };
  sttPollTimer = setTimeout(pollOnce, 200);
}

function sttRenderPartial(inp, prefix, partial) {
  if (partial) inp.value = prefix + partial;
  else inp.value = prefix;
  autoGrow();
}

async function sttStop(silent) {
  sttActive = false;
  if (sttPollTimer) { clearTimeout(sttPollTimer); sttPollTimer = null; }
  $("#micBtn").classList.remove("rec");
  $("#micBtn").textContent = "🎤";
  try { await api("/api/stt/stop", {}); } catch (_) {}
  if (!silent) toast("Stopped listening");
}

}

let _confirmResolve = null, _promptResolve = null;
let _dialogOpen = false;
function confirmDlg(title, msg, yesText = "OK") {
  if (_dialogOpen) return Promise.resolve(false);
  _dialogOpen = true;
  $("#confirmTitle").textContent = title;
  $("#confirmMsg").textContent = msg;
  $("#confirmYes").textContent = yesText;
  $("#confirm").classList.add("on");
  setTimeout(() => { try { $("#confirmYes").focus(); } catch (_) {} }, 0);
  return new Promise(resolve => { _confirmResolve = resolve; });
}
function closeConfirm(result) {
  $("#confirm").classList.remove("on");
  _dialogOpen = false;
  const r = _confirmResolve; _confirmResolve = null; if (r) r(result);
}
function promptDlg(title, msg, initial = "") {
  if (_dialogOpen) return Promise.resolve(null);
  _dialogOpen = true;
  $("#confirmTitle").textContent = title;
  $("#confirmMsg").textContent = msg;
  let box = $("#confirmInput");
  if (!box) {
    box = h("input", { id: "confirmInput", style: "width:100%;margin:8px 0 14px", spellcheck: false });
    $("#confirmMsg").before(box);
  }
  box.value = initial;
  $("#confirmYes").textContent = "Save";
  $("#confirm").classList.add("on");
  setTimeout(() => { box.focus(); box.select(); }, 0);
  box.onkeydown = (e) => {
    if (e.isComposing) return;
    if (e.key === "Enter") { e.preventDefault(); closePrompt(box.value ?? ""); }
    else if (e.key === "Escape") { e.preventDefault(); closePrompt(null); }
  };
  return new Promise(resolve => { _promptResolve = resolve; });
}
function closePrompt(result) {
  $("#confirm").classList.remove("on");
  _dialogOpen = false;
  const r = _promptResolve; _promptResolve = null; if (r) r(result);
}
$("#confirmYes").onclick = () => {
  if (_promptResolve) {
    const el = $("#confirmInput");
    closePrompt(el ? (el.value ?? "") : null);
  } else closeConfirm(true);
};
$("#confirmNo").onclick = () => { if (_promptResolve) closePrompt(null); else closeConfirm(false); };
$("#confirm").onclick = e => { if (e.target.id === "confirm") { if (_promptResolve) closePrompt(null); else closeConfirm(false); } };

  if ($("#modal").classList.contains("on")) {
    if (e.key === "Escape") { e.preventDefault(); answer(false); return; }
    if (e.key === "Enter") {

      if (_promptResolve) {

        else { const el = $("#confirmInput"); closePrompt(el ? (el.value ?? "") : null); }
      } else {

function entrable(input, action) {
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); action(); } });
  return input;
}

let S = null, modelCache = {};

async function act(fn, okMsg) {
  try {
    const r = await fn();
    if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg);
    await refreshKeys(true);
    return r;
  } catch (e) { toast(e.message, 6000); }
}

function snapshotInputs() {
  const snap = {}, pane = $("#pane-keys");
  if (!pane) return snap;
  pane.querySelectorAll("[data-persist]").forEach(el => { snap[el.dataset.persist] = el.value; });
  return snap;
}
function restoreInputs(snap) {
  const pane = $("#pane-keys");
  if (!pane) return;
  pane.querySelectorAll("[data-persist]").forEach(el => { if (snap[el.dataset.persist] !== undefined) el.value = snap[el.dataset.persist]; });
}

async function refreshKeys(force, keepFocus = true, lite = true) {
  const pane = $("#pane-keys");
  if (!force && keepFocus && pane.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const url = lite ? "/api/state?lite=1" : "/api/state";
  try { S = await api(url); } catch (e) { return; }
  for (const p of S.pools || []) {
    if (!modelCache[p.pool] && p.keys && p.keys.length && Array.isArray(p.keys[0].models) && p.keys[0].models.length) {
      modelCache[p.pool] = p.keys[0].models;

  $("#wsChip").replaceChildren("workspace: ", h("b", { text: S.workspace }));
  $("#bgBox").checked = !!S.shell_bg_default;
  $("#bgTog").classList.toggle("on", !!S.shell_bg_default);
  renderKeys();
  renderMcp();
}

function fmtUsedAt(ts) {
  if (!ts) return "";
  const sec = Math.max(1, Math.round(Date.now() / 1000 - ts));
  return "used " + timeAgo(sec);
}

/* MCP */
function parseEnvLines(text) {
  const out = {};
  for (const raw of (text || "").split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    const i = line.indexOf("=");
    if (i <= 0) continue;
    const k = line.slice(0, i).trim();
    let v = line.slice(i + 1).trim();
    if ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) v = v.slice(1, -1);
    if (k) out[k] = v;
  }
  return out;
}
function dumpEnv(obj) {
  return Object.entries(obj || {}).map(([k, v]) => `${k}=${v}`).join("\n");
}
function parseHeaderLines(text) {
  const out = {};
  for (const raw of (text || "").split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    const i = line.indexOf(":");
    if (i <= 0) continue;
    out[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  return out;
}
function dumpHeaders(obj) {
  return Object.entries(obj || {}).map(([k, v]) => `${k}: ${v}`).join("\n");
}
function looksSecret(key) {
  const k = (key || "").toLowerCase();
  return /(token|key|secret|password|passwd|auth|credential|api|pat)/.test(k);
}

      return;

    const short = (row.name || "").split("/").pop().replace(/[^A-Za-z0-9_\-]/g, "_").slice(0, 32) || "mcp";
    if (nameI) nameI.value = short;
    if (t.transport === "http") {
      if (urlI) urlI.value = t.url || "";
      if (cmdI) cmdI.value = "";
      if (argsI) argsI.value = "";
      hint.textContent = "Autofilled remote endpoint for " + row.name + (t.note ? " (" + t.note + ")" : "") + ". Review, then click Add & connect.";
    } else {
      if (urlI) urlI.value = "";

function uploadOne(file) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload?name=" + encodeURIComponent(file.name));
    xhr.setRequestHeader("X-Omni", "1");
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && file.size > 2 * 1024 * 1024) {
        toast(`Uploading ${file.name}: ${Math.round(100 * e.loaded / e.total)}%`, 700);
      }
    };
    xhr.onload = () => {
      if (xhr.status === 200) { try { resolve(JSON.parse(xhr.responseText)); } catch (_) { reject(new Error("bad response")); } }
      else { let msg = `HTTP ${xhr.status}`; try { msg = JSON.parse(xhr.responseText).error || msg; } catch (_) {} reject(new Error(msg)); }
    };
    xhr.onerror = () => reject(new Error("network error"));
    xhr.send(file);
  });
}

async function upload(files) {

      autoGrow(); toast("Uploaded " + d.path);

}

const LARGE_PASTE_CHARS = 20000;
$("#inp").addEventListener("paste", async e => {
  const cd = e.clipboardData || window.clipboardData;
  const txt = cd ? cd.getData("text") : "";
  if (!txt || txt.length < LARGE_PASTE_CHARS) return;
  e.preventDefault();
  const name = `pasted-${Date.now()}.txt`;
  toast(`Large paste (${Math.round(txt.length / 1024)} KB) — attaching as ${name}…`, 4000);
  try {
    const file = new File([new Blob([txt], { type: "text/plain" })], name, { type: "text/plain" });
    const d = await uploadOne(file);
    const inp = $("#inp");
    inp.value = (inp.value ? inp.value + " " : "") + `[pasted text attached as ${d.path}] `;
    inp.focus(); autoGrow(); toast(`Attached ${d.path} (${Math.round(d.size / 1024)} KB)`); loadFiles();
  } catch (err) { toast("Attach failed: " + err.message, 5000); }
});
$("#inp").addEventListener("dragover", e => e.preventDefault());
$("#inp").addEventListener("drop", async e => {
  if (e.dataTransfer.files.length) { e.preventDefault(); upload([...e.dataTransfer.files]); return; }
  const txt = e.dataTransfer.getData("text") || "";
  if (txt.length >= LARGE_PASTE_CHARS) {
    e.preventDefault();
    const name = `dropped-${Date.now()}.txt`;
    try {
      const file = new File([txt], name, { type: "text/plain" });
      const d = await uploadOne(file);
      const inp = $("#inp");
      inp.value += (inp.value ? " " : "") + `[dropped text attached as ${d.path}] `;
      autoGrow(); loadFiles(); toast(`Attached ${d.path} (${Math.round(d.size / 1024)} KB)`);
    } catch (err) { toast("Attach failed: " + err.message, 5000); }
  }
});

  const dlg = h("div", { class: "dlg" },
    h("h3", { style: "margin:0 0 12px !important;font-size:16px", text: "Choose workspace" }),
    recent, pathBar,
    h("div", { class: "row", style: "margin-top:6px" }, crumbs),
    h("div", { class: "row", style: "margin-top:6px" }, filterIn,
      h("label", { class: "tog" }, deepBox, " deep search"),
      h("label", { class: "tog" }, hiddenBox, " hidden")),
    drivesBox, listing,
    h("div", { class: "row", style: "justify-content:flex-end;margin-top:12px" },
      h("button", { text: "Cancel", onclick: () => { overlay.remove(); cleanupKeyHandler(); } })));
  overlay.append(dlg);
  overlay.onclick = e => { if (e.target === overlay) { overlay.remove(); cleanupKeyHandler(); } };
  document.body.append(overlay);
  renderRecent(); go(startPath || (S && S.workspace) || "");
  browseKeyHandler = e => { if (e.key === "Escape") { overlay.remove(); cleanupKeyHandler(); } };
  document.addEventListener("keydown", browseKeyHandler);
  function cleanupKeyHandler() { if (browseKeyHandler) { document.removeEventListener("keydown", browseKeyHandler); browseKeyHandler = null; } }
}
function osWinPath() { return /^[A-Za-z]:[\\/]/.test((S && S.workspace) || ""); }

async function copyText(t) {
  try {
    await navigator.clipboard.writeText(t);
    toast("Copied to clipboard");
  } catch (_) {
    toast("Copy failed — select the text and press Ctrl+C");
  }
}
async function retryMsg(e, ev) {
  e.stopPropagation(); if (busy) return toast("Agent is busy");
  try { const r = await api("/api/chat/retry", { session: sid }); cursor = r.cursor; setBusy(true, false); poll(); }
  catch (e) { toast(e.message); }
}
async function editMsg(e, ev) {
  e.stopPropagation(); if (busy) return toast("Agent is busy");
  const newText = await promptDlg("Edit message", "Edit your message:", ev.text);
  if (newText === null || newText.trim() === ev.text) return;
  try { const r = await api("/api/chat/edit", { session: sid, index: ev.idx, text: newText.trim() }); cursor = r.cursor; setBusy(true, false); poll(); }
  catch (e) { toast(e.message); }
}
async function deleteMsg(e, ev) {
  e.stopPropagation();
  if (!(await confirmDlg("Delete message?", "This message will be removed from the chat history.", "Delete"))) return;
  try { await api("/api/message/delete", { session: sid, index: ev.idx }); loadChat(); }
  catch (e) { toast(e.message); }
}

$("#send").onclick = send;
$("#stop").onclick = doStop;
$("#inp").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("#inp").addEventListener("input", autoGrow);
$("#inp").addEventListener("focus", () => $("#scrollDown").classList.remove("on"));
$("#newChat").onclick = newChat;
/* #menuBtn removed — #expand-left already toggles the collapsed sidebar. */
$("#left-toggle").onclick = () => {
  $("#app").classList.add("leftcollapsed");
  try { store.set("omni_leftcollapsed", "1"); } catch (_) {}
};
$("#expand-left").onclick = () => {
  $("#app").classList.remove("leftcollapsed");
  try { store.set("omni_leftcollapsed", "0"); } catch (_) {}
};
$("#allow").onclick = () => answer(true);
$("#deny").onclick = () => answer(false);
$("#autoBox").onchange = async e => {
  if (e.target.checked && !(await confirmDlg("Enable auto-approve?", "Auto-approve lets the agent run shell commands and change files without asking. Only use this in a workspace you trust.", "Enable"))) { e.target.checked = false; return; }
  const d = await api("/api/auto", { session: sid, on: e.target.checked });
  $("#autoTog").classList.toggle("on", d.auto);
  $("#autoBanner").classList.toggle("on", d.auto);
};
$("#strictBox").onchange = async e => {
  const d = await api("/api/strict", { on: e.target.checked });
  $("#strictTog").classList.toggle("on", d.strict);
  toast("Strict mode " + (d.strict ? "ON" : "OFF"));
};
$("#bgBox").onchange = async e => {
  try {
    const d = await api("/api/shell_bg", { on: e.target.checked });
    $("#bgTog").classList.toggle("on", d.on);
    if (S) S.shell_bg_default = d.on;
    toast("background shell executions " + (d.on ? "ON — run_shell will detach" : "OFF — run_shell streams live"));
  } catch (err) { toast(err.message); }
};
$("#killAllShells").onclick = async () => {
  const running = (window.__shellJobs || []).filter(j => j.alive);
  if (!running.length) return toast("No running background shells");
  if (!(await confirmDlg("Stop all background shells?",
      "This will terminate " + running.length + " running job(s):\n\n" +
      running.map(j => "• " + j.cmd).join("\n"), "Stop all"))) return;
  try {
    const r = await api("/api/shell_jobs/kill_all", {});
    toast("Stopped " + (r.stopped || running.length) + " job(s)");
    loadShellJobs();
  } catch (e) { toast(e.message, 6000); }
};
$("#attach").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = e => { upload([...e.target.files]); e.target.value = ""; };
logEl.addEventListener("dragover", e => e.preventDefault());
logEl.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files.length) upload([...e.dataTransfer.files]); });

document.addEventListener("keydown", e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === "k") {
    e.preventDefault();
    $("#inp").focus();
  } else if (mod && e.shiftKey && e.key.toLowerCase() === "o") {
    e.preventDefault();
    newChat();
  } else if (mod && e.key === "/") {
    e.preventDefault();
    $("#sessSearch").focus();
  } else if (e.key === "Escape" && document.activeElement === $("#inp") && !$("#inp").value) {
    $("#inp").blur();
  }
});

let _refocusTimer = null;
function _watchdogRefocus() {
  if (_refocusTimer) clearTimeout(_refocusTimer);
  _refocusTimer = setTimeout(() => {
    if (document.activeElement && document.activeElement !== document.body) return;
    if ($("#modal").classList.contains("on")) return;
    if ($("#confirm").classList.contains("on")) return;
    if ($("#browse")) return;
    const inp = $("#inp");
    if (!inp || !inp.value) return;
    try { inp.focus({ preventScroll: true }); } catch (_) {}
  }, 120);
}
document.addEventListener("focusout", _watchdogRefocus, true);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") _watchdogRefocus();
});

async function openDiagnostics() {
  let lines = [];
  try {
    const d = await api("/api/logs/tail?n=400");
    lines = d.lines || [];
  } catch (e) {
    return toast("Could not load diagnostics: " + e.message);
  }
  document.getElementById("diag")?.remove();
  const overlay = h("div", { id: "diag", style:
    "position:fixed;inset:0;background:rgba(20,17,14,.55);backdrop-filter:blur(8px);" +
    "display:flex;align-items:center;justify-content:center;z-index:55;padding:20px" });
  const dlg = h("div", { class: "dlg", style:
    "background:var(--panel);border:1px solid var(--line);border-radius:18px;" +
    "padding:22px;width:min(900px,96vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--e4)" },
    h("h3", { style: "margin:0 0 12px !important;font-size:16px", text: "Backend diagnostics (last 400 lines)" }),
    h("pre", { style:
      "flex:1;overflow:auto;background:var(--code);color:var(--code-ink);" +
      "padding:14px;border-radius:12px;font:12px/1.5 var(--font-mono);" +
      "white-space:pre-wrap;word-break:break-word;margin:0",
      text: lines.join("\n") || "(empty)" }),
    h("div", { style: "display:flex;justify-content:flex-end;gap:8px;margin-top:12px" },
      h("button", { text: "Close", onclick: () => overlay.remove() })));
  overlay.append(dlg);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.append(overlay);
}

function openRight(tab) {
  $("#app").classList.add("rightopen");
  store.set("omni_tab", tab);
  document.querySelectorAll(".tabs [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + tab));
  if (tab === "files") loadFiles();
  else if (tab === "mcp") { refreshKeys(true); }
  else if (tab === "memory") { loadMemory(); }
  else if (tab === "skills") { loadSkills(); }
  else refreshKeys(true);
}
$("#diagBtn").onclick = () => openDiagnostics();
$("#keysBtn").onclick = () => $("#app").classList.contains("rightopen") ? $("#app").classList.remove("rightopen") : openRight("keys");
$("#closeRight").onclick = () => $("#app").classList.remove("rightopen");
document.querySelectorAll(".tabs [data-tab]").forEach(b => b.onclick = () => openRight(b.dataset.tab));

$("#routeChip").onclick = () => {
  if (!lastRoute) return toast("No request yet");
  toast(`${lastRoute.pool} · key ${lastRoute.provider} · ${lastRoute.model}` + (lastRoute.fallback ? ` (fallback: ${lastRoute.reason})` : ""), 5000);
};
$("#wsChip").addEventListener("click", () => {
  openBrowser((S && S.workspace) || "", async (p) => {
    const r = await api("/api/workspace/set", { path: p });
    try { S = await api("/api/state"); } catch (_) {}
    $("#wsChip").replaceChildren("workspace: ", h("b", { text: r.workspace }));
    toast("Workspace changed to " + r.workspace);
    await refreshKeys(true);
  });
});

(async function init() {
  // Restore the collapsed-sidebar preference (only ever set by clicking ◀).
  try {
    if (store.get("omni_leftcollapsed") === "1") {
      $("#app").classList.add("leftcollapsed");
    }
  } catch (_) {}
  await refreshKeys(true, true, false);
  await loadChat();
  loadSessions();
  loadShellJobs();
  setInterval(loadShellJobs, 5000);
  if (S) {
    $("#strictBox").checked = !!S.strict;
    $("#strictTog").classList.toggle("on", !!S.strict);
    $("#bgBox").checked = !!S.shell_bg_default;
    $("#bgTog").classList.toggle("on", !!S.shell_bg_default);
  }
  const draft = store.get("omni_draft_" + sid) || "";
  if (draft) { $("#inp").value = draft; autoGrow(); }
  if (S && !S.pools.length) { openRight("keys"); toast("Add your first API key to start"); }
})();
</script>
</body>
</html>
