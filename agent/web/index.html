<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f27; --muted:#667085; --line:#e4e7ec; --accent:#4f46e5; --accent-ink:#fff;
  --user:#eef2ff; --ok:#12a150; --warn:#b7791f; --bad:#d92d20; --tool:#f1f3f6; --code:#0f172a; --code-ink:#e2e8f0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1116; --panel:#161a22; --ink:#e6e9ef; --muted:#98a2b3; --line:#262c38; --accent:#818cf8; --accent-ink:#0e1116;
  --user:#1e2340; --ok:#32d583; --warn:#fdb022; --bad:#f97066; --tool:#1b212c; --code:#0a0d12; --code-ink:#dbe3ef;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
#app{display:grid;grid-template-columns:240px minmax(0,1fr) 0;height:100%}
#app.rightopen{grid-template-columns:240px minmax(0,1fr) 440px}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#right{border-right:0;border-left:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;padding:14px 14px 8px;font-weight:700;font-size:16px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;inset:6px;border:2.5px solid var(--accent-ink);border-radius:50%}
#sessions{overflow:auto;padding:6px;flex:1}
.sess{display:flex;align-items:center;gap:4px;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--muted)}
.sess:hover{background:var(--bg)} .sess.on{background:var(--user);color:var(--ink)}
.sess span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess button{opacity:0;padding:0 6px;border:0;background:none;color:var(--muted)} .sess:hover button{opacity:1}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .sp{flex:1}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);background:var(--bg);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--ink);font-weight:600}
label.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
label.tog.on{color:var(--bad);font-weight:600}
#log{flex:1;overflow:auto;padding:18px 0 8px}
.col{max-width:820px;margin:0 auto;padding:0 18px}
.msg{margin:10px 0;display:flex}
.msg.user{justify-content:flex-end}
.bubble{padding:9px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.user .bubble{background:var(--user);border-bottom-right-radius:4px}
.asst .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;white-space:normal;max-width:100%;box-shadow:var(--shadow)}
.asst.mid .bubble{box-shadow:none;color:var(--muted);background:transparent;border-style:dashed}
.bubble p{margin:.4em 0} .bubble p:first-child{margin-top:0} .bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:.4em 0;padding-left:1.4em}
.bubble h1,.bubble h2,.bubble h3{margin:.6em 0 .3em;font-size:1.05em}
.bubble code{background:var(--tool);padding:1px 5px;border-radius:5px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
.bubble pre{background:var(--code);color:var(--code-ink);padding:10px 12px;border-radius:10px;overflow:auto;margin:.5em 0}
.bubble pre code{background:none;padding:0;color:inherit}
.tool{margin:4px 0;background:var(--tool);border-radius:10px;border:1px solid var(--line);font-size:12.5px}
.tool summary{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool summary .n{font-weight:600} .tool summary .a{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:ui-monospace,Menlo,Consolas,monospace}
.tool .st{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none} .tool .st.ok{background:var(--ok)} .tool .st.bad{background:var(--bad)}
.tool pre{margin:0;padding:8px 12px;border-top:1px solid var(--line);overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,Menlo,Consolas,monospace}
.note{margin:6px 0;font-size:12.5px;color:var(--warn);padding-left:4px}
.note.err{color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);padding:8px 12px;border-radius:10px;white-space:pre-wrap}
.note.verify{color:#b7791f;background:color-mix(in srgb,#b7791f 8%,transparent);
  border:1px solid color-mix(in srgb,#b7791f 30%,transparent);
  padding:8px 12px;border-radius:10px;white-space:pre-wrap;margin:6px 0}
.empty{max-width:560px;margin:12vh auto 0;text-align:center;color:var(--muted)} .empty h2{color:var(--ink);margin:0 0 6px}
.empty .ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
#composer{padding:10px 0 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.box textarea{flex:1;border:0;resize:none;max-height:200px;padding:6px;background:transparent} .box textarea:focus{outline:none}
.working{font-size:12px;color:var(--muted);height:18px;margin:0 4px 4px}
.dots:after{content:"";animation:d 1.2s steps(4) infinite} @keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
/* right panel */
.tabs{display:flex;border-bottom:1px solid var(--line)} .tabs button{flex:1;border:0;border-radius:0;background:none;padding:11px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{overflow:auto;padding:12px;flex:1;display:none} .pane.on{display:block}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--panel)}
.card h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:6px;margin:6px 0;align-items:center;flex-wrap:wrap} .row>input{flex:1}
.small{font-size:12px;color:var(--muted)}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.g{color:var(--ok);border-color:currentColor} .badge.w{color:var(--warn);border-color:currentColor} .badge.r{color:var(--bad);border-color:currentColor}
.keys{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;max-height:240px;overflow:auto}
.k{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}
.k .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok)} .k .dot.rate,.k .dot.server,.k .dot.network{background:var(--warn)} .k .dot.quota{background:#e8590c} .k .dot.auth,.k .dot.billing{background:var(--bad)}
.k .nm{width:84px;font-weight:600} .k .mk{width:84px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px} .k .info{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k button{padding:0 6px;font-size:12px}
.k select{padding:2px 6px;font-size:12px;max-width:200px}
textarea.keysbox{width:100%;height:70px;font:12px ui-monospace,Menlo,Consolas,monospace}
.files a{color:var(--accent);text-decoration:none} .files .f{display:flex;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:13px} .files .f span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px} #modal.on{display:flex}
#modal .dlg{background:var(--panel);border-radius:14px;max-width:640px;width:100%;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
#modal pre{background:var(--code);color:var(--code-ink);padding:10px 12px;border-radius:10px;overflow:auto;max-height:40vh;white-space:pre-wrap;word-break:break-all;font:12.5px ui-monospace,Menlo,Consolas,monospace}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.on{opacity:1}
/* full-PC browser */
#browse .dlg{max-width:760px}
#browse .listing{max-height:52vh;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
#browse .listing .f{display:flex;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
#browse .listing .f:hover{background:var(--bg)}
#browse .listing .f .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){
  #app,#app.rightopen{grid-template-columns:0 minmax(0,1fr) 0}
  #left{position:fixed;inset:0 auto 0 0;width:260px;z-index:10;transform:translateX(-100%);transition:transform .2s} #app.leftopen #left{transform:none;box-shadow:var(--shadow)}
  #right{position:fixed;inset:0;z-index:12;display:none;width:100%} #app.rightopen #right{display:flex}
}
@media (min-width:901px){.only-small{display:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <div class="brand"><i></i> Omni</div>
    <div style="padding:0 12px 8px"><button class="primary" id="newChat" style="width:100%">+ New chat</button></div>
    <div id="sessions"></div>
  </aside>

  <main>
    <header>
      <button class="ghost only-small" id="menuBtn" title="Chats">☰</button>
      <span class="chip" id="wsChip" title="Click to change the agent's workspace (browse your whole PC)"></span>
      <span class="chip" id="routeChip" title="Key and model that answered last">no request yet</span>
      <span class="sp"></span>
      <label class="tog" id="strictTog" title="Verify factual claims in answers"><input type="checkbox" id="strictBox"> strict</label>
      <label class="tog" id="autoTog" title="When on, the agent runs shell commands and writes outside the workspace without asking"><input type="checkbox" id="autoBox"> auto-approve</label>
      <button id="keysBtn">Keys &amp; models</button>
    </header>
    <div id="log"><div class="col" id="msgs"></div></div>
    <div id="composer"><div class="col">
      <div class="working" id="working"></div>
      <div class="box">
        <button class="ghost" id="attach" title="Upload a file into the workspace">📎</button>
        <input type="file" id="fileIn" hidden multiple>
        <textarea id="inp" rows="1" placeholder="Ask Omni to read, edit, run, research…  (Enter = send, Shift+Enter = new line)"></textarea>
        <button class="primary" id="send">Send</button>
        <button class="danger" id="stop" style="display:none">Stop</button>
      </div>
    </div></div>
  </main>

  <aside id="right">
    <div class="tabs"><button class="on" data-tab="keys">Keys &amp; models</button><button data-tab="files">Files</button><button id="closeRight" style="flex:0 0 44px">✕</button></div>
    <div class="pane on" id="pane-keys"></div>
    <div class="pane" id="pane-files"></div>
  </aside>
</div>

<div id="modal"><div class="dlg">
  <h3 style="margin:0 0 8px">Omni wants to do this</h3>
  <pre id="modalAction"></pre>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="deny" class="danger">Deny</button><button id="allow" class="primary">Allow</button></div>
</div></div>
<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function toast(t, ms = 2800) { const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), ms); }
async function api(path, body, opt = {}) {
  const init = body === undefined && !opt.post
    ? { headers: { "X-Omni": "1" } }
    : { method: "POST", headers: { "X-Omni": "1", "Content-Type": "application/json" }, body: JSON.stringify(body || {}) };
  const r = await fetch(path, init);
  let d = {}; try { d = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)), b => b.toString(16).padStart(2, "0")).join("");

/* ---------- markdown (DOM only, no innerHTML) ---------- */
function inline(text) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    const t = m[0];
    if (t[0] === "`") frag.append(h("code", { text: t.slice(1, -1) }));
    else if (t.startsWith("**")) frag.append(h("b", { text: t.slice(2, -2) }));
    else { const mm = /\[([^\]]+)\]\(([^)]+)\)/.exec(t); frag.append(h("a", { href: mm[2], target: "_blank", rel: "noopener noreferrer", text: mm[1] })); }
    last = m.index + t.length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}
function md(src) {
  const root = document.createElement("div");
  const parts = String(src).split(/```/);
  parts.forEach((part, i) => {
    if (i % 2) { const body = part.replace(/^[^\n]*\n/, ""); root.append(h("pre", {}, h("code", { text: body.replace(/\n$/, "") }))); return; }
    let list = null;
    for (const para of part.split(/\n{2,}/)) {
      const lines = para.split("\n");
      for (const ln of lines) {
        let m;
        if ((m = /^\s*([-*]|\d+\.)\s+(.*)/.exec(ln))) {
          const tag = /\d/.test(m[1]) ? "ol" : "ul";
          if (!list || list.tagName.toLowerCase() !== tag) { list = h(tag); root.append(list); }
          list.append(h("li", {}, inline(m[2])));
        } else if ((m = /^(#{1,3})\s+(.*)/.exec(ln))) { list = null; root.append(h("h" + m[1].length, {}, inline(m[2]))); }
        else if (ln.trim()) { list = null; const last = root.lastChild; if (last && last.tagName === "P" && last.dataset.open) { last.append(document.createElement("br"), inline(ln)); } else { const p = h("p", {}, inline(ln)); p.dataset.open = "1"; root.append(p); } }
      }
      list = null;
      if (root.lastChild && root.lastChild.dataset) delete root.lastChild.dataset.open;
    }
  });
  return root;
}

/* ---------- chat ---------- */
let sid = store.get("omni_sid") || rid(), cursor = 0, busy = false, polling = false;
store.set("omni_sid", sid);
const msgs = $("#msgs"), logEl = $("#log"), toolEls = {};
function atBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 120; }
function add(el) { const stick = atBottom(); clearEmpty(); msgs.append(el); if (stick) logEl.scrollTop = logEl.scrollHeight; return el; }
function clearEmpty() { const e = $("#emptyState"); if (e) e.remove(); }
function showEmpty() {
  msgs.append(h("div", { class: "empty", id: "emptyState" },
    h("h2", { text: "What should Omni work on?" }),
    h("div", { text: "It can read and edit code and Word/Excel/PowerPoint files, run commands, browse pages and remember things. It has full read/write access to your PC (with approval)." }),
    h("div", { class: "ex" }, ...["Summarise the files in my Documents folder", "Review the code here and write REVIEW.md", "Create a Word report from my notes"].map(t =>
      h("button", { text: t, onclick: () => { $("#inp").value = t; $("#inp").focus(); } })))));
}
function render(ev) {
  switch (ev.type) {
    case "user": return add(h("div", { class: "msg user" }, h("div", { class: "bubble", text: ev.text })));
    case "assistant": return add(h("div", { class: "msg asst mid" }, h("div", { class: "bubble" }, md(ev.text))));
    case "final": return add(h("div", { class: "msg asst" }, h("div", { class: "bubble" }, md(ev.text))));
    case "tool": {
      let args = ev.text || ""; let pretty = args;
      try { const o = JSON.parse(args); pretty = JSON.stringify(o, null, 1); args = Object.entries(o).map(([k, v]) => k + "=" + (typeof v === "string" ? v : JSON.stringify(v)).replace(/\s+/g, " ")).join("  "); } catch (_) {}
      const d = h("details", { class: "tool" }, h("summary", {}, h("span", { class: "st" }), h("span", { class: "n", text: ev.name }), h("span", { class: "a", text: args.slice(0, 160) })), h("pre", { text: pretty }));
      if (ev.id) toolEls[ev.id] = d; return add(d);
    }
    case "tool_result": {
      const d = toolEls[ev.id]; if (!d) return;
      d.querySelector(".st").classList.add(ev.ok ? "ok" : "bad");
      d.append(h("pre", { text: ev.text })); return;
    }
    case "notice": return add(h("div", { class: "note", text: "↪ " + ev.text }));
    case "verify": return add(h("div", { class: "note verify", text: ev.text }));
    case "route": { const c = $("#routeChip"); c.replaceChildren("answering: ", h("b", { text: ev.text })); return; }
    case "error": return add(h("div", { class: "note err", text: ev.text }));
    case "approval": return askApproval(ev);
    case "approval_done": if (pendingApproval && pendingApproval.id === ev.id) closeModal(); return;
  }
}
function setBusy(b) {
  busy = b; $("#send").style.display = b ? "none" : ""; $("#stop").style.display = b ? "" : "none";
  $("#working").replaceChildren(...(b ? ["Working", h("span", { class: "dots" })] : []));
}
async function poll() {
  if (polling) return; polling = true; let fails = 0;
  try {
    while (true) {
      let d;
      try { d = await api(`/api/poll?session=${sid}&after=${cursor}&wait=15`); fails = 0; }
      catch (e) {
        if (/authoris/.test(e.message)) { toast("Session expired - reopen the link from the terminal"); setBusy(false); break; }
        if (++fails >= 5) { toast("Lost connection to the Omni server: " + e.message, 6000); setBusy(false); break; }
        await new Promise(r => setTimeout(r, 1500)); continue;
      }
      cursor = d.next;
      let done = false;
      for (const ev of d.events) { if (ev.type === "user") continue; if (ev.type === "done") done = true; else render(ev); }
      if (done || !d.busy && !d.events.length) { setBusy(false); refreshKeys(); loadSessions(); break; }
    }
  } finally { polling = false; }
}
async function send() {
  const t = $("#inp").value.trim(); if (!t || busy) return;
  try {
    const r = await api("/api/chat", { session: sid, text: t });
    render({ type: "user", text: t }); $("#inp").value = ""; autoGrow(); cursor = r.cursor; setBusy(true); poll();
  } catch (e) { toast(e.message, 5000); }
}
function autoGrow() { const i = $("#inp"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 200) + "px"; }
async function loadChat() {
  msgs.replaceChildren(); for (const k in toolEls) delete toolEls[k];
  try {
    const d = await api(`/api/history?session=${sid}`);
    d.items.forEach(render); if (!d.items.length) showEmpty();
    cursor = d.cursor; $("#autoBox").checked = d.auto; $("#autoTog").classList.toggle("on", d.auto);
    if (typeof d.strict === "boolean") { $("#strictBox").checked = d.strict; $("#strictTog").classList.toggle("on", d.strict); }
    d.pending.forEach(p => askApproval({ id: p.id, text: p.action }));

async function loadSessions() {

function switchTo(id) { sid = id; store.set("omni_sid", sid); $("#app").classList.remove("leftopen"); loadChat(); loadSessions(); }

/* ---------- approvals ---------- */
let pendingApproval = null;

async function answer(allow) { const p = pendingApproval; if (!p) return; closeModal(); try { await api("/api/approve", { session: sid, id: p.id, allow }); } catch (e) { toast(e.message); } }

/* ---------- keys & models panel ---------- */
let S = null, modelCache = {}, addServicePreset = "";

async function act(fn, okMsg) { try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); await refreshKeys(true); return r; } catch (e) { toast(e.message, 6000); } }

async function refreshKeys(force) {

}

    h("div", { class: "row" },
      h("select", { onchange: e => act(() => api("/api/strategy", { strategy: e.target.value }), "Strategy saved") },
        ...S.strategies.map(s => h("option", { value: s, selected: s === S.strategy, text: s === "round_robin" ? "round robin - spread calls over all keys" : "failover - use keys in order" }))),

function poolCard(p, idx, open) {

/* ---------- files ---------- */
async function loadFiles() {
  const pane = $("#pane-files");
  try {
    const list = await api("/api/files");
    pane.replaceChildren(h("div", { class: "row" }, h("button", { text: "Refresh", onclick: loadFiles }), h("button", { text: "Upload…", onclick: () => $("#fileIn").click() }), h("span", { class: "small", text: list.length + " file(s) in the workspace" })),
      h("div", { class: "files" }, ...list.map(f => h("div", { class: "f" }, h("span", { title: f.path, text: f.path }), h("span", { class: "small", text: f.size > 1048576 ? (f.size / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(f.size / 1024)) + " KB" }), h("a", { href: "/api/file?path=" + encodeURIComponent(f.path), text: "download" })))));
  } catch (e) { pane.textContent = e.message; }
}
async function upload(files) {
  for (const f of files) {
    try { const r = await fetch("/api/upload?name=" + encodeURIComponent(f.name), { method: "POST", headers: { "X-Omni": "1" }, body: f }); const d = await r.json(); if (!r.ok) throw new Error(d.error);
      $("#inp").value = ($("#inp").value + (($("#inp").value && !$("#inp").value.endsWith(" ")) ? " " : "") + `[file in workspace: ${d.path}] `); autoGrow(); toast("Uploaded " + d.path);

/* ---------- full-PC directory browser ---------- */
function openBrowser(startPath, cb) {
  const overlay = h("div", { id: "browse", style: "position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:25;padding:16px" });
  const pathIn = h("input", { value: startPath || "", style: "flex:1" });
  const listing = h("div", { class: "listing" });
  const drivesBox = h("div", { class: "row" });
  async function go(p) {
    try {
      const d = await api(`/api/browse?path=${encodeURIComponent(p || "")}`);
      pathIn.value = d.path;
      listing.replaceChildren(...d.entries.map(en => h("div", { class: "f",
        onclick: () => { if (en.dir) go(en.path); } },
        h("span", { text: en.dir ? "📁" : "📄" }),
        h("span", { class: "nm", text: en.name }),
        en.dir ? null : h("span", { class: "small", text: Math.max(1, Math.round(en.size / 1024)) + " KB" }))));
      drivesBox.replaceChildren(...(d.drives || []).map(dr =>
        h("button", { text: dr, onclick: () => go(dr) })));
    } catch (e) { toast(e.message); }
  }
  const dlg = h("div", { class: "dlg", style: "background:var(--panel);border-radius:14px;border:1px solid var(--line);padding:18px;width:100%;max-width:760px;box-shadow:var(--shadow)" },
    h("h3", { style: "margin:0 0 8px", text: "Browse your PC" }),
    h("div", { class: "row" }, h("button", { text: "⬆ Up",
      onclick: () => go((pathIn.value || "").replace(/[\\/][^\\/]*$/, "") || "/") }), pathIn,
      h("button", { text: "Go", onclick: () => go(pathIn.value) })),
    drivesBox, listing,
    h("div", { class: "row", style: "justify-content:flex-end;margin-top:12px" },
      h("button", { text: "Cancel", onclick: () => overlay.remove() }),
      h("button", { class: "primary", text: "Use this folder",
        onclick: async () => { if (cb) await cb(pathIn.value); overlay.remove(); } })));
  overlay.append(dlg);
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  document.body.append(overlay);
  go(startPath || "");
}

/* ---------- wiring ---------- */
$("#send").onclick = send; $("#stop").onclick = () => api("/api/stop", { session: sid });
$("#inp").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("#inp").addEventListener("input", autoGrow);
$("#newChat").onclick = newChat; $("#menuBtn").onclick = () => $("#app").classList.toggle("leftopen");
$("#allow").onclick = () => answer(true); $("#deny").onclick = () => answer(false);
$("#autoBox").onchange = async e => { if (e.target.checked && !confirm("Auto-approve lets the agent run shell commands and change files without asking. Only use this in a workspace you trust. Turn on?")) { e.target.checked = false; return; } const d = await api("/api/auto", { session: sid, on: e.target.checked }); $("#autoTog").classList.toggle("on", d.auto); };
$("#strictBox").onchange = async e => { const d = await api("/api/strict", { on: e.target.checked }); $("#strictTog").classList.toggle("on", d.strict); toast("Strict mode " + (d.strict ? "ON" : "OFF")); };
$("#attach").onclick = () => $("#fileIn").click(); $("#fileIn").onchange = e => { upload([...e.target.files]); e.target.value = ""; };
logEl.addEventListener("dragover", e => e.preventDefault()); logEl.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files.length) upload([...e.dataTransfer.files]); });
function openRight(tab) { $("#app").classList.add("rightopen"); document.querySelectorAll(".tabs [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === tab)); document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + tab)); if (tab === "files") loadFiles(); else refreshKeys(true); }
$("#keysBtn").onclick = () => $("#app").classList.contains("rightopen") ? $("#app").classList.remove("rightopen") : openRight("keys");
$("#closeRight").onclick = () => $("#app").classList.remove("rightopen");
document.querySelectorAll(".tabs [data-tab]").forEach(b => b.onclick = () => openRight(b.dataset.tab));
setInterval(() => { if ($("#app").classList.contains("rightopen") && $("#pane-keys").classList.contains("on")) refreshKeys(); }, 4000);

/* workspace chip click opens the browser */
$("#wsChip").style.cursor = "pointer";
$("#wsChip").title = "Click to change the agent's workspace (browse your whole PC)";
$("#wsChip").addEventListener("click", () => {
  openBrowser((S && S.workspace) || "", async (p) => {
    const r = await api("/api/workspace/set", { path: p });
    toast("Workspace changed to " + r.workspace);
    refreshKeys(true);
  });
});

(async function init() {
  await refreshKeys(true); await loadChat(); loadSessions();
  if (S) { $("#strictBox").checked = !!S.strict; $("#strictTog").classList.toggle("on", !!S.strict); }
  if (S && !S.pools.length) { openRight("keys"); toast("Add your first API key to start"); }
})();
</script>
