<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omni</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1b1f27; --muted:#667085; --line:#e4e7ec; --accent:#4f46e5; --accent-ink:#fff;
  --user:#eef2ff; --ok:#12a150; --warn:#b7791f; --bad:#d92d20; --tool:#f1f3f6; --code:#0f172a; --code-ink:#e2e8f0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1116; --panel:#161a22; --ink:#e6e9ef; --muted:#98a2b3; --line:#262c38; --accent:#818cf8; --accent-ink:#0e1116;
  --user:#1e2340; --ok:#32d583; --warn:#fdb022; --bad:#f97066; --tool:#1b212c; --code:#0a0d12; --code-ink:#dbe3ef;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
#app{display:grid;grid-template-columns:240px minmax(0,1fr) 0;height:100%;transition:grid-template-columns .3s ease}
#app.leftcollapsed{grid-template-columns:0 minmax(0,1fr) 0}
#app.leftcollapsed.rightopen{grid-template-columns:0 minmax(0,1fr) 420px}
#app.rightopen{grid-template-columns:240px minmax(0,1fr) 420px}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
#left-toggle{position:absolute;top:14px;right:10px;z-index:5;padding:4px;border:0;background:none;opacity:.5;cursor:pointer}
#left-toggle:hover{opacity:1}
#expand-left{position:fixed;top:14px;left:10px;z-index:5;display:none}
#app.leftcollapsed #expand-left{display:block}
#right{border-right:0;border-left:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;padding:14px 14px 8px;font-weight:700;font-size:16px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;inset:6px;border:2.5px solid var(--accent-ink);border-radius:50%}
#sessions{overflow:auto;padding:6px;flex:1}
.sess{display:flex;align-items:center;gap:4px;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--muted)}
.sess:hover{background:var(--bg)} .sess.on{background:var(--user);color:var(--ink)}
.sess span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .t{font-size:11px;color:var(--muted);margin-left:auto}
.sess button{opacity:0;padding:0 6px;border:0;background:none;color:var(--muted)} .sess:hover button{opacity:1}
main{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header .sp{flex:1}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);background:var(--bg);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip b{color:var(--ink);font-weight:600}
label.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
label.tog.on{color:var(--bad);font-weight:600}
label.tog.strict.on{color:var(--warn)}
#log{flex:1;overflow:auto;padding:18px 0 8px}
.col{max-width:860px;margin:0 auto;padding:0 18px}
.msg{margin:10px 0;display:flex}
.msg.user{justify-content:flex-end}
.bubble{padding:9px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.user .bubble{background:var(--user);border-bottom-right-radius:4px}
.asst .bubble{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;white-space:normal;max-width:100%;box-shadow:var(--shadow)}
.asst.mid .bubble{box-shadow:none;color:var(--muted);background:transparent;border-style:dashed}
.bubble p{margin:.4em 0} .bubble p:first-child{margin-top:0} .bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{margin:.4em 0;padding-left:1.4em}
.bubble h1,.bubble h2,.bubble h3{margin:.6em 0 .3em;font-size:1.05em}
.bubble code{background:var(--tool);padding:1px 5px;border-radius:5px;font:12.5px ui-monospace,Menlo,Consolas,monospace}
.bubble pre{background:var(--code);color:var(--code-ink);padding:10px 12px;border-radius:10px;overflow:auto;margin:.5em 0}
.bubble pre code{background:none;padding:0;color:inherit}
.tool{margin:4px 0;background:var(--tool);border-radius:10px;border:1px solid var(--line);font-size:12.5px}
.tool summary{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool summary .n{font-weight:600} .tool summary .a{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:ui-monospace,Menlo,Consolas,monospace}
.tool .st{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none} .tool .st.ok{background:var(--ok)} .tool .st.bad{background:var(--bad)}
.tool pre{margin:0;padding:8px 12px;border-top:1px solid var(--line);overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,Menlo,Consolas,monospace}
.note{margin:6px 0;font-size:12.5px;color:var(--warn);padding-left:4px}
.note.err{color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);padding:8px 12px;border-radius:10px;white-space:pre-wrap}
.note.verify{color:#b7791f;background:color-mix(in srgb,#b7791f 8%,transparent);
  border:1px solid color-mix(in srgb,#b7791f 30%,transparent);
  padding:8px 12px;border-radius:10px;white-space:pre-wrap;margin:6px 0}
.empty{max-width:560px;margin:12vh auto 0;text-align:center;color:var(--muted)} .empty h2{color:var(--ink);margin:0 0 6px}
.empty .ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
#composer{padding:10px 0 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.box textarea{flex:1;border:0;resize:none;max-height:200px;padding:6px;background:transparent} .box textarea:focus{outline:none}
.status{margin:0 0 6px}
.status-card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.status-card .title{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:4px}
.status-card .title .spin{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.status-card .detail{color:var(--muted);font-size:12.5px}
.status-card ul{margin:6px 0 0;padding-left:1.2em;color:var(--muted);font-size:12px;max-height:100px;overflow:auto}
.status-card .foot{display:flex;justify-content:flex-end;margin-top:6px}
.msg-actions{display:flex;gap:8px;margin-top:4px;opacity:0;transition:opacity .2s}
.msg:hover .msg-actions{opacity:1}
.msg.user{flex-direction:column;align-items:flex-end}
.msg.asst{flex-direction:column;align-items:flex-start}
.msg-actions button{padding:3px 8px;font-size:11px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;cursor:pointer;transition:all .2s}
.msg-actions button:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.copy-code{position:absolute;top:8px;right:8px;padding:2px 6px;font-size:11px;opacity:0;transition:opacity .2s;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--muted)}
div:hover>.copy-code{opacity:1}
.copy-code:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs{display:flex;border-bottom:1px solid var(--line)} .tabs button{flex:1;border:0;border-radius:0;background:none;padding:11px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{overflow:auto;padding:12px;flex:1;display:none} .pane.on{display:block}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--panel)}
.card h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:6px;margin:6px 0;align-items:center;flex-wrap:wrap} .row>input{flex:1}
.small{font-size:12px;color:var(--muted)}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.g{color:var(--ok);border-color:currentColor} .badge.w{color:var(--warn);border-color:currentColor} .badge.r{color:var(--bad);border-color:currentColor}
.keys{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;max-height:260px;overflow:auto}
.k{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}
.k .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--ok)} .k .dot.rate,.k .dot.server,.k .dot.network{background:var(--warn)} .k .dot.quota{background:#e8590c} .k .dot.auth,.k .dot.billing{background:var(--bad)}
.k .nm{width:90px;font-weight:600} .k .mk{width:88px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px} .k .info{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.k button{padding:0 6px;font-size:12px}
.k select{padding:2px 6px;font-size:12px;max-width:200px}
textarea.keysbox{width:100%;height:70px;font:12px ui-monospace,Menlo,Consolas,monospace}
.files a{color:var(--accent);text-decoration:none} .files .f{display:flex;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:13px} .files .f span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcp-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.mcp-row .nm{font-weight:600;flex:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px} #modal.on{display:flex}
#modal .dlg{background:var(--panel);border-radius:14px;max-width:640px;width:100%;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
#modal pre{background:var(--code);color:var(--code-ink);padding:10px 12px;border-radius:10px;overflow:auto;max-height:40vh;white-space:pre-wrap;word-break:break-all;font:12.5px ui-monospace,Menlo,Consolas,monospace}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:30;max-width:90vw;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
#browse .dlg{max-width:800px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 0;font-size:12.5px}
.crumbs .crumb{padding:1px 6px;border-radius:6px}
.recent{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
#browse .listing{max-height:48vh;overflow:auto;margin-top:8px;border:1px solid var(--line);border-radius:10px}
#browse .listing .f{display:flex;gap:8px;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
#browse .listing .f:hover{background:var(--bg)}
#browse .listing .f.sel{background:var(--user)}
#browse .listing .f .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:900px){
  #app,#app.rightopen{grid-template-columns:0 minmax(0,1fr) 0}
  #left{position:fixed;inset:0 auto 0 0;width:260px;z-index:10;transform:translateX(-100%);transition:transform .2s} #app.leftopen #left{transform:none;box-shadow:var(--shadow)}
  #right{position:fixed;inset:0;z-index:12;display:none;width:100%} #app.rightopen #right{display:flex}
}
@media (min-width:901px){.only-small{display:none}}
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <button id="left-toggle" title="Collapse sidebar">◀</button>
    <div class="brand"><i></i> Omni</div>
    <div style="padding:0 12px 8px"><button class="primary" id="newChat" style="width:100%">+ New chat</button></div>
    <div id="sessions"></div>
  </aside>

  <main>
    <button id="expand-left" class="ghost" title="Expand sidebar">☰</button>
    <header>
      <button class="ghost only-small" id="menuBtn" title="Chats">☰</button>
      <span class="chip" id="wsChip" title="Click to change the agent's workspace (browse your whole PC)"></span>
      <span class="chip" id="routeChip" title="Key and model that answered last">no request yet</span>
      <span class="sp"></span>
      <label class="tog strict" id="strictTog" title="Verify factual claims in answers"><input type="checkbox" id="strictBox"> strict</label>
      <label class="tog" id="autoTog" title="When on, the agent runs shell commands and writes outside the workspace without asking"><input type="checkbox" id="autoBox"> auto-approve</label>
      <button id="keysBtn">Keys &amp; models</button>
    </header>
    <div id="log"><div class="col" id="msgs"></div></div>
    <div id="composer"><div class="col">
      <div id="working"></div>
      <div class="box">
        <button class="ghost" id="attach" title="Upload a file into the workspace">📎</button>
        <input type="file" id="fileIn" hidden multiple>
        <textarea id="inp" rows="1" placeholder="Ask Omni to read, edit, run, research…  (Enter = send, Shift+Enter = new line)"></textarea>
        <button class="primary" id="send">Send</button>
        <button class="danger" id="stop" style="display:none">Stop</button>
      </div>
    </div></div>
  </main>

  <aside id="right">
    <div class="tabs">
      <button class="on" data-tab="keys">Keys</button>
      <button data-tab="mcp">MCP</button>
      <button data-tab="files">Files</button>
      <button id="closeRight" style="flex:0 0 44px">✕</button>
    </div>
    <div class="pane on" id="pane-keys"></div>
    <div class="pane" id="pane-mcp"></div>
    <div class="pane" id="pane-files"></div>
  </aside>
</div>

<div id="modal"><div class="dlg">
  <h3 style="margin:0 0 8px">Omni wants to do this</h3>
  <pre id="modalAction"></pre>
  <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)">
    <input type="checkbox" id="modalRemember"> Don't ask again for this tool this session
  </label>
  <div class="row" style="justify-content:flex-end;margin-top:12px">
    <button id="deny" class="danger">Deny</button>
    <button id="allow" class="primary">Allow</button>
  </div>
</div></div>
<div id="toasts"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false)
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
function toast(t, ms = 2800) {
  const e = h("div", { class: "toast", text: t });
  $("#toasts").append(e);
  requestAnimationFrame(() => e.classList.add("on"));
  setTimeout(() => { e.classList.remove("on"); setTimeout(() => e.remove(), 300); }, ms);
}
async function api(path, body, opt = {}) {
  const init = body === undefined && !opt.post
    ? { headers: { "X-Omni": "1" } }
    : { method: "POST", headers: { "X-Omni": "1", "Content-Type": "application/json" },
        body: JSON.stringify(body || {}) };
  const r = await fetch(path, init);
  let d = {}; try { d = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
};
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(8)),
  b => b.toString(16).padStart(2, "0")).join("");

function inline(text) {
  const frag = document.createDocumentFragment();
  const re = /(`[^`]+`|\*\*[^*]+\*\*|\[[^\]]+\]\(https?:\/\/[^)\s]+\))/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) frag.append(text.slice(last, m.index));
    const t = m[0];
    if (t[0] === "`") frag.append(h("code", { text: t.slice(1, -1) }));
    else if (t.startsWith("**")) frag.append(h("b", { text: t.slice(2, -2) }));
    else {
      const mm = /\[([^\]]+)\]\(([^)]+)\)/.exec(t);
      frag.append(h("a", { href: mm[2], target: "_blank", rel: "noopener noreferrer", text: mm[1] }));
    }
    last = m.index + t.length;
  }
  if (last < text.length) frag.append(text.slice(last));
  return frag;
}
function md(src) {
  const root = document.createElement("div");
  const parts = String(src).split(/```/);
  parts.forEach((part, i) => {
    if (i % 2) {
      const body = part.replace(/^[^\n]*\n/, "");
      const code = h("code", { text: body.replace(/\n$/, "") });
      const pre = h("pre", {}, code);
      const copyBtn = h("button", { class: "copy-code", text: "Copy",
        onclick: () => copyText(code.textContent) });
      root.append(h("div", { style: "position:relative" }, pre, copyBtn));
      return;
    }
    let list = null;
    for (const para of part.split(/\n{2,}/)) {
      const lines = para.split("\n");
      for (const ln of lines) {
        let m;
        if ((m = /^\s*([-*]|\d+\.)\s+(.*)/.exec(ln))) {
          const tag = /\d/.test(m[1]) ? "ol" : "ul";
          if (!list || list.tagName.toLowerCase() !== tag) { list = h(tag); root.append(list); }
          list.append(h("li", {}, inline(m[2])));
        } else if ((m = /^(#{1,3})\s+(.*)/.exec(ln))) {
          list = null; root.append(h("h" + m[1].length, {}, inline(m[2])));
        } else if (ln.trim()) {
          list = null;
          const last = root.lastChild;
          if (last && last.tagName === "P" && last.dataset.open) {
            last.append(document.createElement("br"), inline(ln));
          } else {
            const p = h("p", {}, inline(ln)); p.dataset.open = "1"; root.append(p);
          }
        }
      }
      list = null;
      if (root.lastChild && root.lastChild.dataset) delete root.lastChild.dataset.open;
    }
  });
  return root;
}

let sid = store.get("omni_sid") || rid(), cursor = 0, busy = false, polling = false;
store.set("omni_sid", sid);
const msgs = $("#msgs"), logEl = $("#log"), toolEls = {};
function atBottom() { return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 140; }
function add(el) {
  const stick = atBottom(); clearEmpty(); msgs.append(el);
  if (stick) logEl.scrollTop = logEl.scrollHeight;
  return el;
}
function clearEmpty() { const e = $("#emptyState"); if (e) e.remove(); }
function showEmpty() {
  msgs.append(h("div", { class: "empty", id: "emptyState" },
    h("h2", { text: "What should Omni work on?" }),
    h("div", { text: "Reads and edits code and Office files, runs commands, browses pages, and (if configured) talks to MCP servers. Full PC access with approval." }),
    h("div", { class: "ex" }, ...[
      "Summarise the files in my Documents folder",
      "Review the code here and write REVIEW.md",
      "Create a Word report from my notes"].map(t =>
      h("button", { text: t, onclick: () => { $("#inp").value = t; $("#inp").focus(); } })))));
}

let statusState = {};
function renderStatus() {
  const w = $("#working");
  if (!busy) { w.replaceChildren(); return; }
  const info = statusState;
  const card = h("div", { class: "status-card" });
  card.append(h("div", { class: "title" },

    kids.push(h("button", { text: "Copy", onclick: () => copyText(ev.text) }));
    if (typeof ev.idx === "number")

  } else if (kind === "assistant") {
    kids.push(h("button", { text: "Retry", onclick: (e) => retryMsg(e, ev) }));
    kids.push(h("button", { text: "Copy", onclick: () => copyText(ev.text) }));

function render(ev) {
  switch (ev.type) {
    case "user": return add(h("div", { class: "msg user" },
      h("div", { class: "bubble", text: ev.text }),
      actionsFor("user", ev)));

    case "assistant": return add(h("div", { class: "msg asst mid" },
      h("div", { class: "bubble" }, md(ev.text)),
      actionsFor("assistant", ev)));

    case "final": return add(h("div", { class: "msg asst" },
      h("div", { class: "bubble" }, md(ev.text)),
      actionsFor("final", ev)));

    case "tool": {
      let args = ev.text || "", pretty = args;
      try {
        const o = JSON.parse(args);
        pretty = JSON.stringify(o, null, 1);
        args = Object.entries(o).map(([k, v]) =>
          k + "=" + (typeof v === "string" ? v : JSON.stringify(v)).replace(/\s+/g, " ")).join("  ");
      } catch (_) {}
      const d = h("details", { class: "tool" },
        h("summary", {}, h("span", { class: "st" }), h("span", { class: "n", text: ev.name }),
          h("span", { class: "a", text: args.slice(0, 160) })),
        h("pre", { text: pretty }));
      if (ev.id) toolEls[ev.id] = d;

    }
    case "tool_result": {

      d.querySelector(".st").classList.add(ev.ok ? "ok" : "bad");
      if (!d.querySelector("pre.stream")) d.append(h("pre", { text: ev.text }));
      else if (!ev.ok) d.append(h("pre", { text: "ERROR (see stream above):\n" + ev.text }));
      return;
    }
    case "tool_stream": {
      const d = toolEls[ev.id]; if (!d) return;
      let pre = d.querySelector("pre.stream");
      if (!pre) { pre = h("pre", { class: "stream" }); d.append(pre); }
      pre.textContent += ev.text;
      if (atBottom()) logEl.scrollTop = logEl.scrollHeight;
      return;
    }
    case "notice": return add(h("div", { class: "note", text: "↪ " + ev.text }));
    case "progress":
      updateStatus({ title: ev.title || "Working", detail: ev.detail, recent: ev.recent, route: ev.route });
      return;
    case "verify": return add(h("div", { class: "note verify", text: ev.text }));
    case "route": {

      c.title = "pool=" + ev.pool + " model=" + ev.model + " reason=" + (ev.reason || "primary");
      updateStatus({ route: ev.text });
      return;
    }
    case "error": return add(h("div", { class: "note err", text: ev.text }));
    case "approval": return askApproval(ev);
    case "approval_done": if (pendingApproval && pendingApproval.id === ev.id) closeModal(); return;

}

async function poll() {
  if (polling) return; polling = true; let fails = 0;
  try {
    while (true) {
      let d;
      try { d = await api(`/api/poll?session=${sid}&after=${cursor}&wait=15`); fails = 0; }
      catch (e) {
        if (/authoris/.test(e.message)) { toast("Session expired — reopen the link from the terminal"); setBusy(false); break; }
        if (++fails >= 5) { toast("Lost connection to the Omni server: " + e.message, 6000); setBusy(false); break; }
        await new Promise(r => setTimeout(r, 1500)); continue;
      }
      cursor = d.next;
      let done = false;
      for (const ev of d.events) {
        if (ev.type === "user") continue;
        if (ev.type === "done") done = true; else render(ev);
      }
      if (done || (!d.busy && !d.events.length)) {
        setBusy(false); refreshKeys(); loadSessions();
        // Re-hydrate from history so every message carries a stable `idx`
        // and the full action row (Edit/Delete/Retry/Copy) is present.
        loadChat();
        break;
      }
    }
  } finally { polling = false; }
}

/* Key panel: mutate the DOM locally instead of rebuilding the whole pane
   on every action. Only a full refresh when the shape of the panel changes
   (add keys, remove key, add service, remove pool, model list refresh). */
async function act(fn, okMsg, opts = {}) {
  try {
    const r = await fn();
    if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg);
    if (opts.refresh) {
      await refreshKeys(true, opts.keepFocus !== false);
    } else {
      // Cheap background refresh: update S but only re-render if the
      // shape of the data changed. We detect that by comparing pool names
      // and key names; if they match, we just patch health/status in place.
      const prev = S;
      try { S = await api("/api/state"); } catch (_) { return r; }
      if (opts.patch === false || !sameShape(prev, S)) renderKeys();
      else patchKeysInPlace();
    }
    return r;
  } catch (e) { toast(e.message, 6000); }
}
function sameShape(a, b) {
  if (!a || !b) return false;
  if (a.pools.length !== b.pools.length) return false;
  for (let i = 0; i < a.pools.length; i++) {
    const pa = a.pools[i], pb = b.pools[i];
    if (pa.pool !== pb.pool) return false;
    if (pa.keys.length !== pb.keys.length) return false;
    for (let j = 0; j < pa.keys.length; j++) {
      if (pa.keys[j].name !== pb.keys[j].name) return false;
    }
  }
  return true;
}
function patchKeysInPlace() {
  // Update the "ready / cooling / invalid" badges, the info line, and the
  // status dot for each key, without touching the DOM structure.
  const pane = $("#pane-keys");
  if (!pane) return;
  S.pools.forEach((p, i) => {
    const card = pane.querySelectorAll(".card")[i + 2];   // skip rotation + models cards
    if (!card) return;
    const badges = card.querySelectorAll(".badge");
    // The three badges are: ready, cooling (optional), invalid (optional).
    // Rebuild their text in place if present, else leave the structure alone.
    const counts = p.counts;
    const have = [...badges].map(b => b.textContent);
    const want = [];
    want.push(counts.ready + " ready");
    if (counts.cooling) want.push(counts.cooling + " cooling");
    if (counts.invalid) want.push(counts.invalid + " invalid");
    for (let k = 0; k < Math.min(have.length, want.length); k++) {
      if (have[k] !== want[k]) badges[k].textContent = want[k];
    }
    // Key rows: patch dot class and info text
    const rows = card.querySelectorAll(".keys .k");
    p.keys.forEach((k, j) => {
      const row = rows[j]; if (!row) return;
      const dot = row.querySelector(".dot");
      if (dot) dot.className = "dot " + k.status;
      const info = row.querySelector(".info");
      if (info) {

          ? `ok ${k.ok} · fail ${k.fail} · score ${k.score}`
          : `${k.status === "auth" ? "INVALID KEY" : k.status} ${fmtTime(k.remaining)}${k.reason ? " — " + k.reason : ""}`;
        info.title = k.reason || k.last_error || "";

    });
  });

                            "Cooldowns cleared", { patch: true }) }),
      h("button", { class: "danger", text: "Remove service",
        onclick: () => {
          if (confirm("Remove " + p.pool + " and all its " + p.keys.length + " keys?"))
            act(() => api("/api/pool/remove", { pool: p.pool }), "Removed",
                { refresh: true });
        } })),
    keysList,
    h("div", { class: "row" }, addBox),
    h("div", { class: "row" }, addKeysBtn));
}

function addServiceCard() {
  const preset = h("select", {},
    h("option", { value: "", text: "Custom / other…" }),
    ...S.presets.map(p => h("option", { value: p.name, text: p.name })));
  const name = h("input", { placeholder: "service name, e.g. groq", spellcheck: false });
  const url = h("input", { placeholder: "base URL (OpenAI-compatible, ends in /v1)", spellcheck: false });
  const model = h("input", { placeholder: "model id", spellcheck: false });
  const keys = h("textarea", { class: "keysbox",
    placeholder: "API key(s) — one per line or comma separated", spellcheck: false });
  preset.addEventListener("change", () => {
    const p = S.presets.find(x => x.name === preset.value);
    if (p) { name.value = p.name; url.value = p.base_url; model.value = p.model; }
  });
  const addBtn = h("button", { class: "primary", text: "Add",
    onclick: () => act(() => api("/api/keys/add",
      { pool: name.value, base_url: url.value, model: model.value, keys: keys.value }),
      r => `Added ${r.added} key(s)` + (r.duplicates ? `, ${r.duplicates} duplicate(s) skipped` : ""),
      { refresh: true }) });
  [name, url, model].forEach(el => entrable(el, () => addBtn.click()));
  keys.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); addBtn.click(); }
  });
  return h("div", { class: "card" },
    h("h3", { text: "Add a service" }),
    h("div", { class: "row" }, preset, name),
    h("div", { class: "row" }, url),
    h("div", { class: "row" }, model),
    keys,
    h("div", { class: "row" }, addBtn),
    h("div", { class: "small", text: "Keys stay on this computer in data/providers.json and are never sent back to the browser." }));
}

function renderMcp() {
  const pane = $("#pane-mcp"); if (!pane || !S) return;
  const scroll = pane.scrollTop;
  pane.replaceChildren();
  pane.append(h("div", { class: "card" },
    h("h3", { text: "MCP servers" }),
    h("div", { class: "small", text: "Model Context Protocol servers extend Omni with new tools (filesystem, github, sqlite, playwright…). Configure servers in data/mcp.json or add them below. Tools appear to the model as mcp__<server>__<tool>." })));
  if (S.mcp_load_errors && S.mcp_load_errors.length) {
    pane.append(h("div", { class: "note err", text: S.mcp_load_errors.join("\n") }));
  }
  if (!S.mcp || !S.mcp.length) {
    pane.append(h("div", { class: "card" },
      h("div", { class: "small", text: "No servers configured yet." })));
  } else {
    for (const m of S.mcp) {
      pane.append(h("div", { class: "card" },
        h("div", { class: "mcp-row" },
          h("span", { style: "width:10px;height:10px;border-radius:50%;background:" + (m.ready ? "var(--ok)" : "var(--bad)") }),
          h("span", { class: "nm", text: m.name }),
          badge(m.tools + " tools", m.ready ? "g" : "r"),
          m.error ? h("span", { class: "small", text: m.error }) : null,
          h("button", { text: "Restart",
            onclick: () => act(() => api("/api/mcp/restart", { name: m.name }), r => r.result, { refresh: true }) }),
          h("button", { text: "Stop",
            onclick: () => act(() => api("/api/mcp/stop", { name: m.name }), "Stopped", { refresh: true }) }),
          h("button", { class: "primary", text: "Start",
            onclick: () => act(() => api("/api/mcp/start", { name: m.name }),
                                r => `${m.name}: ${r.tools} tools`, { refresh: true }) })),
        h("div", { class: "small", text: m.command })));
    }
  }
  const name = h("input", { placeholder: "server name (e.g. filesystem)", spellcheck: false });
  const cmd = h("input", { placeholder: "command (e.g. npx)", spellcheck: false });
  const args = h("input", { placeholder: "args, space-separated (e.g. -y @modelcontextprotocol/server-filesystem /home/you)", spellcheck: false });
  const addBtn = h("button", { class: "primary", text: "Add & connect",
    onclick: () => act(() => api("/api/mcp/add", { name: name.value, command: cmd.value,
      args: args.value.split(/\s+/).filter(Boolean) }),
      r => `Connected: ${r.tools} tools`, { refresh: true }) });
  [name, cmd, args].forEach(el => entrable(el, () => addBtn.click()));
  pane.append(h("div", { class: "card" },
    h("h3", { text: "Add an MCP server" }),
    h("div", { class: "row" }, name, cmd),
    h("div", { class: "row" }, args),
    h("div", { class: "row" }, addBtn),
    h("div", { class: "small", text: "Standard examples: npx -y @modelcontextprotocol/server-filesystem <dir> · npx -y @modelcontextprotocol/server-github · uvx mcp-server-sqlite --db-path <file>" })));
  pane.scrollTop = scroll;
}

async function loadFiles() {
  const pane = $("#pane-files");
  try {
    const list = await api("/api/files");
    pane.replaceChildren(
      h("div", { class: "row" },
        h("button", { text: "Refresh", onclick: loadFiles }),
        h("button", { text: "Upload…", onclick: () => $("#fileIn").click() }),
        h("span", { class: "small", text: list.length + " file(s) in the workspace" })),
      h("div", { class: "files" }, ...list.map(f => h("div", { class: "f" },
        h("span", { title: f.path, text: f.path }),
        h("span", { class: "small", text: f.size > 1048576
          ? (f.size / 1048576).toFixed(1) + " MB"
          : Math.max(1, Math.round(f.size / 1024)) + " KB" }),
        h("a", { href: "/api/file?path=" + encodeURIComponent(f.path), text: "download" })))));
  } catch (e) { pane.textContent = e.message; }
}
async function upload(files) {
  for (const f of files) {
    try {
      const r = await fetch("/api/upload?name=" + encodeURIComponent(f.name),
        { method: "POST", headers: { "X-Omni": "1" }, body: f });
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      const cur = $("#inp").value;
      $("#inp").value = cur + (cur && !cur.endsWith(" ") ? " " : "") + `[file in workspace: ${d.path}] `;
      autoGrow();
      toast("Uploaded " + d.path);
    } catch (e) { toast("Upload failed: " + e.message, 5000); }
  }
  loadFiles();
}

function openBrowser(startPath, cb) {
  const overlay = h("div", { id: "browse",
    style: "position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:25;padding:16px" });

  const crumbs = h("div", { class: "crumbs" });
  const recent = h("div", { class: "recent" });
  const listing = h("div", { class: "listing" });
  const filterIn = h("input", { placeholder: "Filter…", style: "flex:1" });
  const deepBox = h("input", { type: "checkbox" });
  const hiddenBox = h("input", { type: "checkbox" });
  const drivesBox = h("div", { class: "row" });
  let allEntries = [];
  let curPath = "";

  function renderEntries() {
    const f = filterIn.value.toLowerCase();
    const filtered = f && !deepBox.checked
      ? allEntries.filter(en => en.name.toLowerCase().includes(f))
      : allEntries;
    listing.replaceChildren(...filtered.slice(0, 500).map(en => {
      const row = h("div", { class: "f", title: en.path },
        h("span", { text: en.dir ? "📁" : "📄" }),
        h("span", { class: "nm", text: en.name }),
        en.dir ? null : h("span", { class: "small",
          text: Math.max(1, Math.round(en.size / 1024)) + " KB" }));
      row.addEventListener("click", () => {
        listing.querySelectorAll(".f.sel").forEach(x => x.classList.remove("sel"));
        row.classList.add("sel");
      });
      row.addEventListener("dblclick", () => {
        if (en.dir) go(en.path);
      });
      return row;
    }));
  }

  filterIn.addEventListener("input", () => {
    if (deepBox.checked) return;
    renderEntries();
  });
  deepBox.addEventListener("change", () => { if (deepBox.checked) go(curPath, true); });

  function setCrumbs(p) {
    crumbs.replaceChildren();
    const isWin = /^[A-Za-z]:[\\/]/.test(p);
    const parts = p.split(/[\\/]/).filter(Boolean);
    let acc = isWin ? "" : "/";
    const home = h("button", { class: "ghost", text: "🏠", title: "Home",
      onclick: () => go((S && S.workspace) || "") });
    crumbs.append(home);
    parts.forEach((part, i) => {
      if (i === 0 && isWin) acc = part + "\\";
      else if (isWin) acc = acc.replace(/\\?$/, "\\") + part;
      else acc = acc.replace(/\/?$/, "/") + part;
      const target = acc;
      crumbs.append(h("span", { text: isWin ? "\\" : "/" }));
      crumbs.append(h("button", { class: "ghost crumb", text: part,
        onclick: () => go(target) }));
    });
  }

  function renderRecent() {
    let rec = [];
    try { rec = JSON.parse(store.get("omni_recent_ws") || "[]"); } catch (_) { rec = []; }
    recent.replaceChildren(...rec.slice(0, 6).map(r =>
      h("button", { class: "ghost", title: r,
        text: r.split(/[\\/]/).filter(Boolean).pop() || r,
        onclick: () => go(r) })));
  }
  function pushRecent(p) {
    let rec = [];
    try { rec = JSON.parse(store.get("omni_recent_ws") || "[]"); } catch (_) { rec = []; }
    rec = [p, ...rec.filter(x => x !== p)].slice(0, 10);
    store.set("omni_recent_ws", JSON.stringify(rec));
    renderRecent();
  }

  async function go(p, deep = false) {
    const q = new URLSearchParams({ path: p || "" });
    if (deep && filterIn.value.trim()) q.set("search", filterIn.value.trim());
    if (hiddenBox.checked) q.set("hidden", "1");
    try {
      const d = await api("/api/browse?" + q);
      curPath = d.path;
      setCrumbs(d.path);
      allEntries = d.entries;
      renderEntries();
      drivesBox.replaceChildren(...(d.drives || []).map(dr =>
        h("button", { text: dr, onclick: () => go(dr) })));
    } catch (e) { toast(e.message); }
  }

  const useBtn = h("button", { class: "primary", text: "Use this folder",
    onclick: async () => {
      if (cb) await cb(curPath);
      pushRecent(curPath);
      overlay.remove();
    } });
  const pathBar = h("div", { class: "row" },
    h("button", { text: "⬆ Up",
      onclick: () => go((curPath || "").replace(/[\\/][^\\/]*$/, "") ||
        (curPath.match(/^[A-Za-z]:/) ? curPath.slice(0, 3) : "/")) }),
    crumbs,
    h("span", { style: "flex:1" }),
    useBtn);

  const dlg = h("div", { class: "dlg",
    style: "background:var(--panel);border-radius:14px;border:1px solid var(--line);padding:18px;width:100%;max-width:800px;box-shadow:var(--shadow)" },
    h("h3", { style: "margin:0 0 4px", text: "Choose workspace" }),
    recent,
    pathBar,
    h("div", { class: "row", style: "margin-top:6px" },
      filterIn,
      h("label", { class: "tog" }, deepBox, " deep search"),
      h("label", { class: "tog" }, hiddenBox, " hidden")),
    drivesBox,
    listing,
    h("div", { class: "row", style: "justify-content:flex-end;margin-top:10px" },
      h("button", { text: "Cancel", onclick: () => overlay.remove() })));
  overlay.append(dlg);
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  document.body.append(overlay);
  renderRecent();
  go(startPath || (S && S.workspace) || "");
}

function copyText(t) { navigator.clipboard.writeText(t); toast("Copied to clipboard"); }
async function retryMsg(e, ev) {
  e.stopPropagation();
  if (busy) return toast("Agent is busy");
  try {
    const r = await api("/api/chat/retry", { session: sid });
    cursor = r.cursor; setBusy(true, false); poll();
  } catch (e) { toast(e.message); }
}
async function editMsg(e, ev) {
  e.stopPropagation();
  if (busy) return toast("Agent is busy");
  const newText = prompt("Edit message:", ev.text);
  if (newText === null || newText.trim() === ev.text) return;
  try {
    const r = await api("/api/chat/edit", { session: sid, index: ev.idx, text: newText.trim() });
    cursor = r.cursor; setBusy(true, false); poll();
  } catch (e) { toast(e.message); }
}
async function deleteMsg(e, ev) {
  e.stopPropagation();
  if (!confirm("Delete this message?")) return;
  try { await api("/api/message/delete", { session: sid, index: ev.idx }); loadChat(); }
  catch (e) { toast(e.message); }
}

$("#send").onclick = send;
$("#stop").onclick = doStop;
$("#inp").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("#inp").addEventListener("input", autoGrow);
$("#newChat").onclick = newChat;
$("#menuBtn").onclick = () => $("#app").classList.toggle("leftopen");
$("#left-toggle").onclick = () => $("#app").classList.add("leftcollapsed");
$("#expand-left").onclick = () => $("#app").classList.remove("leftcollapsed");
$("#allow").onclick = () => answer(true);
$("#deny").onclick = () => answer(false);
$("#autoBox").onchange = async e => {
  if (e.target.checked && !confirm("Auto-approve lets the agent run shell commands and change files without asking. Only use this in a workspace you trust. Turn on?")) {
    e.target.checked = false; return;
  }
  const d = await api("/api/auto", { session: sid, on: e.target.checked });
  $("#autoTog").classList.toggle("on", d.auto);
};
$("#strictBox").onchange = async e => {
  const d = await api("/api/strict", { on: e.target.checked });
  $("#strictTog").classList.toggle("on", d.strict);
  toast("Strict mode " + (d.strict ? "ON" : "OFF"));
};
$("#attach").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = e => { upload([...e.target.files]); e.target.value = ""; };
logEl.addEventListener("dragover", e => e.preventDefault());
logEl.addEventListener("drop", e => {
  e.preventDefault();
  if (e.dataTransfer.files.length) upload([...e.dataTransfer.files]);
});

function openRight(tab) {
  $("#app").classList.add("rightopen");
  document.querySelectorAll(".tabs [data-tab]").forEach(b =>
    b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll(".pane").forEach(p =>
    p.classList.toggle("on", p.id === "pane-" + tab));
  if (tab === "files") loadFiles();
  else if (tab === "mcp") { refreshKeys(true); renderMcp(); }
  else refreshKeys(true);
}
$("#keysBtn").onclick = () =>
  $("#app").classList.contains("rightopen")
    ? $("#app").classList.remove("rightopen")
    : openRight("keys");
$("#closeRight").onclick = () => $("#app").classList.remove("rightopen");
document.querySelectorAll(".tabs [data-tab]").forEach(b =>
  b.onclick = () => openRight(b.dataset.tab));

/* NOTE: the 5-second auto-refresh of the keys panel has been removed.
   It was rebuilding the pane mid-interaction and clobbering the scroll
   position. The panel now refreshes on open, on shape-changing actions,
   and manually (via the Refresh all model lists button). */

$("#wsChip").style.cursor = "pointer";
$("#wsChip").addEventListener("click", () => {
  openBrowser((S && S.workspace) || "", async (p) => {
    const r = await api("/api/workspace/set", { path: p });
    toast("Workspace changed to " + r.workspace);
    refreshKeys(true);
  });
});

(async function init() {
  await refreshKeys(true); await loadChat(); loadSessions();
  if (S) {
    $("#strictBox").checked = !!S.strict;
    $("#strictTog").classList.toggle("on", !!S.strict);
  }
  if (S && !S.pools.length) { openRight("keys"); toast("Add your first API key to start"); }
})();
</script>
