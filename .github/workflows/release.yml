name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            python-arch: x64
            msvc-arch: x64
            artifact-name: omni-windows-x64
            artifact-path: |
              dist/*.dist/**
              !dist/*.build/**
              !dist/*.onefile-build/**
          - os: windows-latest
            name: windows-x86
            python-arch: x86
            msvc-arch: x86
            artifact-name: omni-windows-x86
            artifact-path: |
              dist/*.dist/**
              !dist/*.build/**
              !dist/*.onefile-build/**

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-arch }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}
          cache: 'pip'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Set up MSVC (${{ matrix.msvc-arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Cache Nuitka build
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/Nuitka/Nuitka
          key: nuitka-${{ matrix.name }}-${{ hashFiles('requirements*.txt', 'agent/**') }}
          restore-keys: |
            nuitka-${{ matrix.name }}-

      - name: Build with Nuitka
        run: python build.py

      - name: Verify binary bit-width
        shell: pwsh
        run: |
          $exe = "dist/omni.dist/omni.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          switch ($machine) {
            0x014c { $arch = "x86" }
            0x8664 { $arch = "x64" }
            0xAA64 { $arch = "arm64" }
            default { throw ("unknown PE machine 0x{0:X4}" -f $machine) }
          }
          Write-Host "Built $arch binary"
          if ($arch -ne "${{ matrix.python-arch }}") {
            throw "expected ${{ matrix.python-arch }}, got $arch"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    # Publish only if BOTH windows-x64 and windows-x86 succeeded. Without
    # this guard, one failed matrix job silently skips the whole release
    # (default `needs:` semantics).
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Latest tag matching The-Omni-Agent-*
          latest=$(git tag --list 'The-Omni-Agent-*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            new="The-Omni-Agent-1.0.0"
            range="HEAD"
          else
            # Bump the major version: The-Omni-Agent-X.0.0 -> X+1.0.0
            num=$(echo "$latest" | sed -E 's/^The-Omni-Agent-([0-9]+)\.0\.0$/\1/')
            if [ "$num" = "$latest" ]; then
              new="${latest}-next"
            else
              new="The-Omni-Agent-$((num + 1)).0.0"
            fi
            if git rev-parse --verify "$latest" >/dev/null 2>&1; then
              range="$latest..HEAD"
            else
              range="HEAD"
            fi
          fi
          echo "new_tag=$new" >> "$GITHUB_OUTPUT"
          echo "commits_range=$range" >> "$GITHUB_OUTPUT"
          echo "Building $new from $range"

      - name: Build changelog
        shell: bash
        env:
          RANGE: ${{ steps.meta.outputs.commits_range }}
        run: |
          set -euo pipefail
          raw=$(git log "$RANGE" --pretty=format:'%s (%h)' || true)
          if [ -z "$raw" ]; then raw=$(git log -n 10 --pretty=format:'%s (%h)'); fi
          {
            echo "## Release ${{ steps.meta.outputs.new_tag }}"
            echo
            feats=$(echo "$raw" | grep -iE '^feat' || true)
            fixes=$(echo "$raw" | grep -iE '^fix' || true)
            others=$(echo "$raw" | grep -ivE '^(feat|fix)' || true)
            if [ -n "$feats" ]; then
              echo "### 🚀 Features"
              echo "$feats" | sed 's/^/* /'
              echo
            fi
            if [ -n "$fixes" ]; then
              echo "### 🛠️ Bug Fixes"
              echo "$fixes" | sed 's/^/* /'
              echo
            fi
            if [ -n "$others" ]; then
              echo "### 📝 Other Changes"
              echo "$others" | sed 's/^/* /'
              echo
            fi
            if [ -z "$raw" ]; then echo "No changes since last release."; fi
            echo "---"
            echo "*This release was automatically generated.*"
          } > changelog.md
          cat changelog.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package each variant
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            # Find the .dist folder inside the artifact (Nuitka layout)
            dist=$(find "$dir" -maxdepth 3 -type d -name '*.dist' | head -n1 || true)
            if [ -n "$dist" ]; then
              cp -R "$dist" "out/$name"
            else
              # Fallback: copy whatever's there
              cp -R "$dir" "out/$name"
            fi
          done
          ls -la out/

      - name: Zip per-OS
        shell: bash
        run: |
          set -euo pipefail
          cd out
          for name in *; do
            if [[ "$name" == *windows* ]]; then
              zip -qr "${name}.zip" "$name"
            else
              tar -czf "${name}.tar.gz" "$name"
            fi
          done
          cd ..
          ls -la out/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.new_tag }}
          name: ${{ steps.meta.outputs.new_tag }}
          body_path: changelog.md
          files: |
            out/*.zip
            out/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}