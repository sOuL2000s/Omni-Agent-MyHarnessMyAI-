name: Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Generate Release Metadata
        id: meta
        shell: python
        run: |
          import subprocess
          import os
          import re

          def get_latest_tag():
              try:
                  # Get all tags that match the pattern
                  tags = subprocess.check_output(["git", "tag", "--list", "The-Omni-Agent-*", "--sort=-v:refname"]).decode().splitlines()
                  return tags[0] if tags else None
              except:
                  return None

          latest_tag = get_latest_tag()
          print(f"Latest tag found: {latest_tag}")
          
          if not latest_tag:
              new_tag = "The-Omni-Agent-1.0.0"
              commits_range = "HEAD"
          else:
              # Pattern: The-Omni-Agent-X.0.0
              match = re.match(r"The-Omni-Agent-(\d+)\.0\.0", latest_tag)
              if match:
                  major = int(match.group(1))
                  new_tag = f"The-Omni-Agent-{major + 1}.0.0"
              else:
                  # Fallback if pattern doesn't match exactly
                  new_tag = f"{latest_tag}-next"
              commits_range = f"{latest_tag}..HEAD"

          try:
              changelog_raw = subprocess.check_output(["git", "log", commits_range, "--pretty=format:%s (%h)"]).decode()
          except:
              changelog_raw = subprocess.check_output(["git", "log", "-n", "10", "--pretty=format:%s (%h)"]).decode()
          
          lines = changelog_raw.splitlines()
          features = [l for l in lines if l.lower().startswith("feat")]
          fixes = [l for l in lines if l.lower().startswith("fix")]
          others = [l for l in lines if not any(l.lower().startswith(x) for x in ["feat", "fix"])]

          changelog = f"## Release {new_tag}\n\n"
          if features:
              changelog += "### 🚀 Features\n" + "\n".join(f"* {l}" for l in features) + "\n\n"
          if fixes:
              changelog += "### 🛠️ Bug Fixes\n" + "\n".join(f"* {l}" for l in fixes) + "\n\n"
          if others:
              changelog += "### 📝 Other Changes\n" + "\n".join(f"* {l}" for l in others) + "\n\n"
          
          if not lines:
              changelog += "No changes since last release.\n"

          changelog += "\n---\n*This release was automatically generated by GitHub Actions.*"

          with open("changelog.md", "w", encoding="utf-8") as f:
              f.write(changelog)
          
          print("Generated Changelog:")
          print(changelog)
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"NEW_TAG={new_tag}\n")

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Nuitka
        run: |
          python build.py --clean

      - name: Package as ZIP
        shell: pwsh
        run: |
          $newTag = "${{ steps.meta.outputs.NEW_TAG }}"
          $folderName = "The-Omni-Agent"
          if (Test-Path $folderName) { Remove-Item -Recurse -Force $folderName }
          Move-Item -Path dist/omni.dist -Destination $folderName
          $zipName = "$newTag-Windows.zip"
          Compress-Archive -Path $folderName -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.NEW_TAG }}
          name: ${{ steps.meta.outputs.NEW_TAG }}
          body_path: changelog.md
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
