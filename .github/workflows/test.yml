name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime test deps
        # Skip selenium / webdriver-manager in CI — they aren't needed by tests
        # and are slow to install.
        run: python -m pip install python-docx openpyxl python-pptx tzdata
      - name: Run tests
        run: python -m unittest discover tests -v